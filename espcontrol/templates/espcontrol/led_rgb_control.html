{% extends 'espcontrol/base.html' %}

{% block content %}
<style>
    .rgb-wrap { max-width: 720px; margin: 0 auto; padding: 10px 16px 60px; }
    .rgb-title { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); font-size: 1.8rem; margin-bottom: 4px; }
    .rgb-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

    .rgb-card {
        background: var(--glass-bg); border: 1px solid var(--border-color);
        border-radius: 16px; padding: 22px; margin-bottom: 20px;
    }
    .rgb-card h3 {
        font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px;
        color: var(--neon-cyan); margin-bottom: 16px;
    }

    .preview-row { display: flex; align-items: center; gap: 20px; }
    #colorBall {
        width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;
        border: 2px solid rgba(255,255,255,0.15); box-shadow: 0 0 25px rgba(0,0,0,0.4);
        transition: background-color .2s;
    }
    #rgbLabel { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--text-light); }
    #hexLabel { font-family: monospace; color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }
    #statusLabel { font-size: 0.8rem; margin-top: 8px; }
    .status-ok   { color: var(--neon-green); }
    .status-wait { color: #ffd700; }
    .status-off  { color: var(--neon-red); }

    .picker-row { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
    #colorPicker { width: 56px; height: 40px; border: none; border-radius: 8px; background: none; cursor: pointer; }
    .apply-btn {
        background: var(--neon-cyan); color: #050a1f; border: none; border-radius: 10px;
        padding: 10px 18px; font-weight: 700; cursor: pointer;
    }
    .apply-btn:hover { opacity: 0.85; }

    .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .swatch-btn {
        display: flex; align-items: center; gap: 8px; padding: 8px 14px;
        border-radius: 10px; border: 1px solid var(--border-color);
        background: rgba(255,255,255,0.03); color: var(--text-light);
        cursor: pointer; font-size: 0.85rem;
    }
    .swatch-btn:hover { border-color: var(--neon-cyan); }
    .swatch-dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); }

    .effect-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .effect-btn {
        padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border-color);
        background: rgba(255,255,255,0.03); color: var(--text-light); cursor: pointer; font-size: 0.85rem;
    }
    .effect-btn.active { border-color: var(--neon-cyan); background: rgba(0,210,255,0.12); color: var(--neon-cyan); }
</style>

<div class="rgb-wrap">
    {% csrf_token %}
    <div class="rgb-title">🌈 LED RGB</div>
    <div class="rgb-sub">Contrôle de la LED — même état partagé avec l'app mobile et l'ESP32.</div>

    <div class="rgb-card">
        <div class="preview-row">
            <div id="colorBall"></div>
            <div>
                <div id="rgbLabel">RGB(0, 0, 0)</div>
                <div id="hexLabel">#000000</div>
                <div id="statusLabel" class="status-wait">Chargement…</div>
            </div>
        </div>

        <div class="picker-row">
            <input type="color" id="colorPicker" value="#000000">
            <button class="apply-btn" id="applyBtn">✅ Appliquer</button>
        </div>
    </div>

    <div class="rgb-card">
        <h3>Préréglages rapides</h3>
        <div class="swatches" id="swatches"></div>
    </div>

    <div class="rgb-card">
        <h3>Jeux lumineux</h3>
        <div class="effect-grid" id="effects"></div>
    </div>
</div>

<script>
const PRESETS = [
    { label: '🔴 Rouge',   r: 255, g: 0,   b: 0   },
    { label: '🟢 Vert',    r: 0,   g: 255, b: 0   },
    { label: '🔵 Bleu',    r: 0,   g: 0,   b: 255 },
    { label: '🟡 Jaune',   r: 255, g: 200, b: 0   },
    { label: '🟣 Violet',  r: 160, g: 0,   b: 255 },
    { label: '🩵 Cyan',    r: 0,   g: 210, b: 255 },
    { label: '🟠 Orange',  r: 255, g: 120, b: 0   },
    { label: '⚪ Blanc',   r: 255, g: 255, b: 255 },
    { label: '⚫ Éteint',  r: 0,   g: 0,   b: 0   },
];
const EFFECTS = [
    { key: 'fixe',        label: '⏹️ Fixe' },
    { key: 'arc_en_ciel', label: '🌈 Arc-en-ciel' },
    { key: 'pulsation',   label: '💓 Pulsation' },
    { key: 'clignotant',  label: '⚡ Clignotant' },
    { key: 'strobe',      label: '✨ Strobe' },
];

let state = { r: 0, g: 0, b: 0, effect: 'fixe' };

// SessionAuthentication de DRF vérifie le CSRF lui-même pour les requêtes non
// sûres (POST), indépendamment du @csrf_exempt Django de la vue — sans ce
// header, l'appliquation depuis le site échouerait silencieusement en 403.
function getCsrfToken() {
    const match = document.cookie.match(/csrftoken=([^;]+)/);
    return match ? match[1] : '';
}

function hex(n) { return n.toString(16).padStart(2, '0'); }

function render() {
    document.getElementById('colorBall').style.backgroundColor = `rgb(${state.r},${state.g},${state.b})`;
    document.getElementById('rgbLabel').textContent = `RGB(${state.r}, ${state.g}, ${state.b})`;
    document.getElementById('hexLabel').textContent = `#${hex(state.r)}${hex(state.g)}${hex(state.b)}`;
    document.getElementById('colorPicker').value = `#${hex(state.r)}${hex(state.g)}${hex(state.b)}`;
    document.querySelectorAll('.effect-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.key === state.effect);
    });
}

function renderStatus(confirmed) {
    const el = document.getElementById('statusLabel');
    if (!confirmed) {
        el.textContent = '🟡 En attente de confirmation matérielle…';
        el.className = 'status-wait';
    } else if (confirmed.stale) {
        el.textContent = `⚠️ Aucune confirmation depuis ${confirmed.seconds_ago}s (LED hors ligne ?)`;
        el.className = 'status-off';
    } else {
        el.textContent = `🟢 Confirmé par la LED il y a ${confirmed.seconds_ago}s`;
        el.className = 'status-ok';
    }
}

async function load() {
    const res = await fetch('/api/mobile/led-color/');
    const data = await res.json();
    state = { r: data.r, g: data.g, b: data.b, effect: data.effect };
    render();
    renderStatus(data.confirmed);
}

async function apply(r, g, b, effect = state.effect) {
    state = { r, g, b, effect };
    render();
    renderStatus(null);
    await fetch('/api/mobile/led-color/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
        body: JSON.stringify({ r, g, b, effect }),
    });
}

document.getElementById('swatches').innerHTML = PRESETS.map(p =>
    `<button class="swatch-btn" data-r="${p.r}" data-g="${p.g}" data-b="${p.b}">
        <span class="swatch-dot" style="background:rgb(${p.r},${p.g},${p.b})"></span>${p.label}
    </button>`
).join('');
document.getElementById('swatches').addEventListener('click', (e) => {
    const btn = e.target.closest('.swatch-btn');
    if (!btn) return;
    apply(+btn.dataset.r, +btn.dataset.g, +btn.dataset.b, 'fixe');
});

document.getElementById('effects').innerHTML = EFFECTS.map(ef =>
    `<button class="effect-btn" data-key="${ef.key}">${ef.label}</button>`
).join('');
document.getElementById('effects').addEventListener('click', (e) => {
    const btn = e.target.closest('.effect-btn');
    if (!btn) return;
    apply(state.r, state.g, state.b, btn.dataset.key);
});

document.getElementById('applyBtn').addEventListener('click', () => {
    const hexVal = document.getElementById('colorPicker').value;
    const r = parseInt(hexVal.slice(1, 3), 16);
    const g = parseInt(hexVal.slice(3, 5), 16);
    const b = parseInt(hexVal.slice(5, 7), 16);
    apply(r, g, b, 'fixe');
});

load();
setInterval(load, 3000);
</script>
{% endblock %}

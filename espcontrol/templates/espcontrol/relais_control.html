{% extends "espcontrol/base.html" %}

{% block content %}
<style>
    /* --- Thème Général Futuriste --- */
    body {
        /* Arrière-plan complexe (dégradé + grille) */
        background:
            radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 1) 0%, rgba(15, 23, 42, 1) 50%, rgba(2, 6, 23, 1) 100%),
            linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 60px 60px, 60px 60px;
        background-attachment: fixed;
        color: #f1f5f9;
        font-family: 'Segoe UI', Roboto, "Helvetica Neue", sans-serif;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
    }

    .container {
        max-width: 500px; /* Un peu plus étroit pour une seule commande */
        margin: 40px auto;
        padding: 30px;
        /* Fond semi-transparent avec effet de flou */
        background-color: rgba(30, 41, 59, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        border: 1px solid rgba(51, 65, 85, 0.5);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        text-align: center;
    }

    /* --- Header --- */
    .header-icon {
        font-size: 50px;
        color: #22d3ee; /* Cyan */
        margin-bottom: 15px;
        text-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
    }

    h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 30px;
        color: #fff;
    }
    h1 span.relay-id { color: #22d3ee; }

    /* --- Carte de contrôle --- */
    .control-card {
        background-color: rgba(15, 23, 42, 0.6);
        padding: 25px;
        border-radius: 16px;
        border: 1px solid rgba(34, 211, 238, 0.1);
        margin-bottom: 30px;
        transition: all 0.3s ease;
    }
    .control-card:hover {
        border-color: rgba(34, 211, 238, 0.3);
        box-shadow: 0 5px 15px rgba(34, 211, 238, 0.1);
    }

    .status-icon {
        font-size: 60px;
        margin-bottom: 15px;
        transition: all 0.3s ease;
    }
    .status-text {
        font-size: 1.2rem;
        margin-bottom: 20px;
        font-weight: 600;
    }
    .status-on { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.4); }
    .status-off { color: #94a3b8; }

    /* --- Boutons --- */
    .action-btn {
        width: 100%;
        padding: 12px 25px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: white;
    }

    /* Bouton rouge pour éteindre */
    .btn-danger {
        background-color: #ef4444;
        box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover { background-color: #dc2626; box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5); }

    /* Bouton cyan pour allumer */
    .btn-cyan {
        background-color: #22d3ee;
        color: #0f172a;
        box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
    }
    .btn-cyan:hover { background-color: #0ea5e9; box-shadow: 0 6px 20px rgba(34, 211, 238, 0.5); }

    /* Bouton rafraichir (plus discret) */
    .refresh-btn {
        background-color: transparent;
        border: 1px solid #22d3ee;
        color: #22d3ee;
        padding: 10px 20px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .refresh-btn:hover {
        background-color: rgba(34, 211, 238, 0.1);
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
    }
</style>

<div class="container">
    <div class="header-icon">
        <i class="fas fa-satellite-dish"></i>
    </div>
    <h1>Contrôle du Relais <span class="relay-id">#{{ relais.num }}</span></h1>

    <div class="control-card">
        {% if relais.etat %}
            <i class="fas fa-plug-circle-bolt status-icon status-on"></i>
            <p class="status-text status-on">État : ALIMENTÉ ⚡</p>
        {% else %}
            <i class="fas fa-plug status-icon status-off"></i>
            <p class="status-text status-off">État : HORS TENSION 💤</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <button class="action-btn {% if relais.etat %}btn-danger{% else %}btn-cyan{% endif %}" type="submit">
                {% if relais.etat %}
                    <i class="fas fa-power-off"></i> Éteindre le relais {{ relais.num }}
                {% else %}
                    <i class="fas fa-bolt"></i> Allumer le relais {{ relais.num }}
                {% endif %}
            </button>
        </form>
    </div>

    <form method="get">
        <button type="submit" class="refresh-btn">
            <i class="fas fa-sync-alt"></i> Actualiser l'état
        </button>
    </form>
</div>

{% endblock %}

{% extends "eduplay/base.html" %}
{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* --- VARIABLES ET STYLES GLOBAUX FUTURISTES --- */
    :root {
        --bg-dark: #050a1f;
        --bg-darker: #0d1229;
        --text-light: #e0e6ff;
        --neon-cyan: #00d2ff;
        --neon-green: #00ff99;
        --neon-purple: #bd00ff;
        --neon-red: #ff3366;
        --glass-bg: rgba(13, 18, 41, 0.8);
        --border-neon: 1px solid rgba(0, 210, 255, 0.3);
    }

    body {
        font-family: 'Roboto', sans-serif;
        background-color: var(--bg-dark);
        background-image:
            radial-gradient(circle at 50% 30%, var(--bg-darker) 0%, var(--bg-dark) 100%),
            url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2300d2ff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        color: var(--text-light);
        /* Important pour le mobile : laisse de la place pour la barre de nav fixe en bas */
        padding-bottom: 80px;
    }

    h2, h5, .quiz-heading { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 1px; }

    /* --- CONTENEUR PRINCIPAL GLASSMORPHISM --- */
    .quiz-main-container {
        max-width: 900px;
        margin: 30px auto;
        padding: 30px;
        background: var(--glass-bg);
        backdrop-filter: blur(15px);
        border-radius: 25px;
        border: var(--border-neon);
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 210, 255, 0.1);
        position: relative;
    }

    /* --- HEADER DU QUIZ (Titre, Score, Timer) --- */
    .quiz-header-top {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 20px;
    }
    .quiz-title { color: var(--neon-cyan); margin: 0; text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }

    .data-panel { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    /* Blocs de données futuristes */
    .data-box {
        background: rgba(0, 0, 0, 0.3); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--neon-cyan); display: flex; flex-direction: column; align-items: center; min-width: 110px; flex-grow: 1;
    }
    .data-label { font-size: 0.8rem; color: var(--neon-cyan); margin-bottom: 5px; text-transform: uppercase; }
    .data-value { font-family: 'Orbitron'; font-size: 1.5rem; font-weight: bold; }
    #current_score { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
    #timer { color: var(--neon-purple); text-shadow: 0 0 10px var(--neon-purple); }

    .btn-reset-neon {
        border: 1px solid var(--neon-red); color: var(--neon-red); background: transparent; padding: 8px 12px; border-radius: 8px; transition: all 0.3s; cursor: pointer;
    }
    .btn-reset-neon:hover { background: rgba(255, 51, 102, 0.2); box-shadow: 0 0 15px var(--neon-red); color: white;}

    /* --- BARRE DE PROGRESSION ÉNERGIE --- */
    .progress-container-neon {
        height: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 6px; overflow: hidden; margin-bottom: 30px; box-shadow: inset 0 0 5px #000; border: 1px solid rgba(255,255,255,0.1);
    }
    .progress-bar-neon {
        height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); box-shadow: 0 0 15px var(--neon-cyan); transition: width 1s linear, background 0.5s ease, box-shadow 0.5s ease;
    }

    /* --- ZONE DE QUESTION --- */
    #question-number { color: var(--neon-cyan); margin-bottom: 15px; display: block; font-family: 'Orbitron'; font-size: 0.9rem;}
    .question-text-styled { font-size: 1.4rem; color: #fff; margin-bottom: 35px; line-height: 1.4; font-weight: 500; }

    /* --- BOUTONS DE RÉPONSE HOLOGRAPHIQUES (Le cœur du design mobile) --- */
    .answer-option-container { display: flex; flex-direction: column; gap: 15px; }
    /* On cache l'input standard */
    .answer-input-hidden { display: none; }

    /* Le label devient le bouton */
    .answer-label-styled {
        display: flex; align-items: center; padding: 18px 20px;
        background: rgba(255, 255, 255, 0.03); border: 2px solid rgba(0, 210, 255, 0.3);
        border-radius: 15px; cursor: pointer; transition: all 0.3s ease;
        font-size: 1.1rem; color: var(--text-light); position: relative; overflow: hidden;
        backdrop-filter: blur(5px);
    }
    .answer-label-styled:hover {
        background: rgba(0, 210, 255, 0.1); border-color: var(--neon-cyan); box-shadow: 0 0 25px rgba(0, 210, 255, 0.2); color: white;
    }
    /* Style quand l'input associé est coché */
    .answer-input-hidden:checked + .answer-label-styled {
        background: rgba(0, 255, 153, 0.15); border-color: var(--neon-green); color: #fff; box-shadow: 0 0 30px rgba(0, 255, 153, 0.3);
    }
    /* Icône personnalisée avant le texte (remplace le rond/carré standard) */
    .answer-label-styled::before {
        content: ''; display: inline-block; width: 24px; height: 24px; border: 2px solid var(--neon-cyan); border-radius: 50%; margin-right: 20px; transition: all 0.3s ease; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); flex-shrink: 0; background: rgba(0,0,0,0.2);
    }
    .answer-input-hidden[type="checkbox"] + .answer-label-styled::before { border-radius: 6px; } /* Carré pour checkbox */
    .answer-input-hidden:checked + .answer-label-styled::before {
        background: var(--neon-green); border-color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green);
    }

    /* --- BOUTONS DE NAVIGATION --- */
    .nav-buttons-wrapper {
        display: flex; justify-content: space-between; gap: 20px; margin-top: 40px;
    }
    .btn-neon {
        padding: 15px 30px; border-radius: 12px; font-family: 'Orbitron'; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease; border: none; display: flex; align-items: center; justify-content: center; font-size: 1rem;
    }
    /* Bouton Précédent / Rejouer */
    .btn-prev-neon {
        background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
    }
    .btn-prev-neon:hover:not(:disabled) { background: rgba(0, 210, 255, 0.2); box-shadow: 0 0 30px var(--neon-cyan); color: #fff; }

    /* Bouton Suivant / Soumettre */
    .btn-next-neon, .btn-submit-neon {
        background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green)); color: #050a1f; box-shadow: 0 0 25px rgba(0, 210, 255, 0.3); flex-grow: 1;
    }
    .btn-next-neon:hover:not(:disabled), .btn-submit-neon:hover:not(:disabled) {
        box-shadow: 0 0 40px rgba(0, 255, 153, 0.5); transform: translateY(-3px);
    }
    .btn-neon:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); transform: none !important; box-shadow: none !important; background: rgba(255,255,255,0.1); color: #888; border-color: transparent;}

    /* --- FEEDBACK & ALERTES FUTURISTES --- */
    .alert-neon {
        background: rgba(13, 18, 41, 0.95); border: 2px solid; border-radius: 15px; padding: 25px; font-size: 1.1rem; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .alert-neon-success { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 30px rgba(0, 255, 153, 0.2); }
    .alert-neon-danger { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 30px rgba(255, 51, 102, 0.2); }
    .alert-neon-info { border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); }
    .alert-neon-warning { border-color: var(--neon-purple); color: var(--neon-purple); box-shadow: 0 0 30px rgba(189, 0, 255, 0.2); }

    /* --- CORRECTION STYLISÉE --- */
    .correction-card {
        background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-neon); border-radius: 15px; padding: 25px; margin-bottom: 25px;
    }
    .correction-q-title { font-family: 'Orbitron'; color: var(--neon-cyan); margin-bottom: 20px; font-size: 1.1rem; }
    .correction-list li { margin-bottom: 12px; padding: 12px 15px; border-radius: 10px; background: rgba(0,0,0,0.2); display: flex; align-items: flex-start; line-height: 1.5; }
    .correction-list li i { margin-top: 4px; font-size: 1.2rem; }
    .text-success-neon { color: var(--neon-green); text-shadow: 0 0 8px rgba(0, 255, 153, 0.5); }
    .text-danger-neon { color: var(--neon-red); text-shadow: 0 0 8px rgba(255, 51, 102, 0.5); }
    .text-muted-neon { color: var(--text-light); opacity: 0.6; }


    /* =========================================
       RESPONSIVE (MOBILE FIRST OPTIMIZATION)
    ========================================= */
    @media (max-width: 768px) {
        .quiz-main-container { padding: 20px; margin: 15px auto; border-width: 1px; }
        
        /* Header compact sur mobile */
        .quiz-header-top { flex-direction: column; align-items: flex-start; gap: 15px; margin-bottom: 20px;}
        .quiz-title { font-size: 1.5rem; }
        .data-panel { width: 100%; justify-content: space-between; gap: 10px; }
        .data-box { padding: 8px; min-width: auto; }
        .data-label { font-size: 0.7rem; }
        .data-value { font-size: 1.3rem; }
        .btn-reset-neon { padding: 8px; }

        /* Texte plus petit */
        .question-text-styled { font-size: 1.2rem; margin-bottom: 25px; }
        
        /* Boutons de réponse optimisés pour le tactile */
        .answer-label-styled { padding: 15px; font-size: 1rem; }
        .answer-label-styled::before { width: 20px; height: 20px; margin-right: 15px; }

        /* BARRE DE NAVIGATION FIXE EN BAS SUR MOBILE */
        .nav-buttons-fixed-container {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(13, 18, 41, 0.98); /* Fond presque opaque */
            padding: 15px 20px; z-index: 1000;
            border-top: 2px solid var(--neon-cyan); 
            backdrop-filter: blur(20px);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .nav-buttons-wrapper { margin-top: 0; gap: 15px; }
        .btn-neon { padding: 12px 15px; font-size: 0.9rem; flex: 1; } /* Boutons se partagent l'espace */
        .btn-prev-neon { flex: 0.6; } /* Bouton précédent un peu plus petit */
    }
</style>

<div class="quiz-main-container">
    <div class="quiz-header-top">
        <h2 class="quiz-title"><i class="fas fa-brain me-2"></i> {{ domain }}</h2>
        <div class="data-panel">
            <div class="data-box">
                <span class="data-label"><i class="fas fa-star"></i> Score</span>
                <span class="data-value" id="current_score">0</span>
            </div>
            <div class="data-box" style="border-color: var(--neon-purple);">
                <span class="data-label"><i class="fas fa-clock"></i> Temps</span>
                <span class="data-value" id="timer">600</span>
            </div>
            <div>
                 <button type="button" class="btn-reset-neon" id="reset-score-btn" title="Réinitialiser le score local"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>
    </div>

    <div class="progress-container-neon">
        <div id="progress-bar" class="progress-bar-neon" style="width: 100%;"></div>
    </div>

    <div id="message-area" class="mb-4"></div>

    <form id="quiz-form" method="post">
        {% csrf_token %}
        <div id="question-container" class="mb-4"></div>

        <div class="nav-buttons-fixed-container">
            <div class="nav-buttons-wrapper">
                <button type="button" class="btn-neon btn-prev-neon" id="prev-btn"><i class="fas fa-chevron-left me-2"></i> Précédent</button>
                <button type="button" class="btn-neon btn-next-neon" id="next-btn" disabled>Suivant <i class="fas fa-chevron-right ms-2"></i></button>
                <button type="submit" class="btn-neon btn-submit-neon d-none" id="submit-btn" disabled><i class="fas fa-check-circle me-2"></i> Soumettre</button>
            </div>
        </div>
    </form>

    <div id="final-message" class="alert-neon mt-4 d-none"></div>

    <div class="d-flex justify-content-center gap-3 mt-5 flex-wrap mb-5">
        <button type="button" id="replay-btn" class="btn-neon btn-prev-neon d-none" style="border-color: var(--neon-green); color: var(--neon-green);"><i class="fas fa-redo-alt me-2"></i> Rejouer le quiz</button>
        <div id="post-submit-links" class="d-none">
            <a href="{% url 'eduplay:answers_page' %}" class="btn-neon btn-prev-neon" style="border-color: var(--neon-purple); color: var(--neon-purple); text-decoration: none; display: inline-flex;"><i class="fas fa-list-alt me-2"></i> Voir la correction détaillée</a>
        </div>
    </div>

    <div id="correction-container" class="mt-5 d-none mb-5"></div>
</div>

<script>
const questions = [
    {% for q in questions %}
    {
        id: {{ q.id }},
        text: `{{ q.question_text|escapejs }}`,
        multiple: {{ q.multiple_answers|yesno:"true,false" }},
        answers: [
            {% for a in q.answers.all %}
            { id: {{ a.id }}, text: `{{ a.answer_text|escapejs }}`, correct: {{ a.is_correct|yesno:"true,false" }} },
            {% endfor %}
        ]
    },
    {% endfor %}
];

let currentIndex = 0, score = 0, submitted = false;
let userAnswers = {}, evaluatedQuestions = {};
let timeLeft = 600, timerInterval;
let attempt = 1;

function startTimer() {
    const timerEl = document.getElementById("timer");
    const progressBar = document.getElementById("progress-bar");
    const totalTime = 600; // Temps fixe initial

    timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        progressBar.style.width = (timeLeft / totalTime) * 100 + "%";

        // Changement de couleur quand le temps presse (moins de 60s)
        if (timeLeft < 60) {
             progressBar.style.background = 'linear-gradient(90deg, var(--neon-red), var(--neon-purple))';
             progressBar.style.boxShadow = '0 0 20px var(--neon-red)';
        }

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            if (!submitted) {
                submitted = true;
                showMessage("⏳ Temps écoulé ! Quiz terminé automatiquement.", "danger");
                saveAnswer(true);
                showFinalMessage();
                showUserAnswers();
                renderQuestion(currentIndex);
                sendAnswersToServer();
            }
        }
    }, 1000);
}

// --- MODIFICATION : Utilisation des alertes néon ---
function showMessage(text, type="info") {
    const alertType = type === 'success' ? 'success' : type === 'danger' ? 'danger' : 'info';
    document.getElementById("message-area").innerHTML = `<div class="alert-neon alert-neon-${alertType}"><i class="fas fa-info-circle me-2"></i> ${text}</div>`;
    // Scroll vers le message sur mobile
    document.getElementById("message-area").scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// --- MODIFICATION MAJEURE : Génération du HTML des questions ---
function renderQuestion(index) {
    const q = questions[index];
    const container = document.getElementById("question-container");
    
    // Nouvelle structure HTML pour la question et les réponses sous forme de boutons
    let html = `
        <span id="question-number"><i class="fas fa-question-circle me-1"></i> Question ${index + 1} / ${questions.length}</span>
        <h3 class="question-text-styled">${q.text}</h3>
        <div class="answer-option-container">
    `;

    q.answers.forEach(a => {
        const inputType = q.multiple ? "checkbox" : "radio";
        const nameAttr = q.multiple ? `answers_${q.id}[]` : `answers_${q.id}`;
        const checked = userAnswers[q.id]?.includes(a.id) ? "checked" : "";
        const disabled = submitted ? "disabled" : "";

        // Structure : Input caché + Label stylisé en bouton
        html += `
            <div>
                <input class="answer-input-hidden" type="${inputType}" name="${nameAttr}" value="${a.id}" id="answer_${a.id}" ${checked} ${disabled}>
                <label class="answer-label-styled" for="answer_${a.id}">
                    ${a.text}
                </label>
            </div>`;
    });

    html += `</div>`; // Fin container réponses
    container.innerHTML = html;

    // Mise à jour des boutons de navigation
    document.getElementById("prev-btn").disabled = submitted || index === 0;
    const isLast = index === questions.length - 1;
    document.getElementById("next-btn").classList.toggle("d-none", isLast);
    document.getElementById("submit-btn").classList.toggle("d-none", !isLast);
    toggleNextButton();

    if (!submitted) {
        // On écoute les changements sur les inputs cachés
        document.querySelectorAll(".answer-input-hidden").forEach(input =>
            input.addEventListener("change", () => {
                saveAnswer(false);
                evaluateCurrentQuestion();
                toggleNextButton();
            })
        );
    }
    // Scroll en haut de la question sur mobile lors du changement
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// --- MODIFICATION : Ciblage des nouveaux inputs cachés ---
function toggleNextButton() {
    const selected = document.querySelectorAll('.answer-input-hidden:checked');
    const isDisabled = selected.length === 0 || submitted;
    document.getElementById("next-btn").disabled = isDisabled;
    if (currentIndex === questions.length - 1) {
        document.getElementById("submit-btn").disabled = isDisabled;
    }
}

function saveAnswer(evaluate=false) {
    const q = questions[currentIndex];
    const name = q.multiple ? `answers_${q.id}[]` : `answers_${q.id}`;
    // Ciblage des inputs cachés
    userAnswers[q.id] = Array.from(document.querySelectorAll(`[name="${name}"]:checked`)).map(i => parseInt(i.value));
    if (evaluate) evaluateAllAnswers();
}

function evaluateAllAnswers() {
    score = 0;
    evaluatedQuestions = {};
    for (let q of questions) {
        const selected = userAnswers[q.id] || [];
        const correctAnswers = q.answers.filter(a => a.correct).map(a => a.id).sort();
        const userSorted = [...selected].sort();
        const isCorrect = JSON.stringify(correctAnswers) === JSON.stringify(userSorted);
        evaluatedQuestions[q.id] = isCorrect;
        score += isCorrect ? 1 : 0;
    }
    document.getElementById("current_score").innerText = score;
}

function evaluateCurrentQuestion() {
    const q = questions[currentIndex];
    const selected = userAnswers[q.id] || [];
    const correctAnswers = q.answers.filter(a => a.correct).map(a => a.id).sort();
    const userSorted = [...selected].sort();
    const isCorrect = JSON.stringify(correctAnswers) === JSON.stringify(userSorted);
    evaluatedQuestions[q.id] = isCorrect;
    score = Object.values(evaluatedQuestions).filter(v => v).length;
    document.getElementById("current_score").innerText = score;
}

// --- MODIFICATION : Affichage du résultat final stylisé ---
function showFinalMessage() {
    evaluateAllAnswers();
    const total = questions.length;
    const msg = document.getElementById("final-message");
    
    let icon = score === total ? "🏆" : score >= total-3 ? "🚀" : score >= total-5 ? "👍" : "💪";
    let title = score === total ? "Résultat Légendaire !" : score >= total-3 ? "Excellent Travail !" : "Quiz Terminé";
    let message = score === total ? "Incroyable ! Un sans-faute absolu." :
                  score >= total-3 ? `Très belle performance ! Seulement ${total-score} erreur(s).` :
                  score >= total-5 ? `Pas mal du tout. ${total-score} erreur(s) à revoir.` :
                                     `Continuez vos efforts. ${total-score} erreur(s) identifiée(s).`;

    let alertClass = score === total ? "alert-neon-success" :
                     score >= total-3 ? "alert-neon-info" :
                     score >= total-5 ? "alert-neon-warning" : "alert-neon-danger";

    msg.className = `alert-neon ${alertClass} mt-5`;
    msg.innerHTML = `
        <h2 style="font-family:'Orbitron'; margin-bottom:20px;">${icon} ${title}</h2>
        <p class="mb-4" style="font-size:1.2rem;">${message}</p>
        <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:15px; display:inline-block; border:1px solid ${score === total ? 'var(--neon-green)' : 'var(--text-light)'}">
            <h4 style="font-family:'Orbitron'; margin:0;">Score Final : <span style="color:${score === total ? 'var(--neon-green)' : 'var(--neon-cyan)'}; font-size:1.8em; font-weight:bold;">${score}</span> / ${total}</h4>
        </div>
    `;
    msg.classList.remove("d-none");

    document.getElementById("post-submit-links").classList.remove("d-none");
    if (attempt === 1) { document.getElementById("replay-btn").classList.remove("d-none"); }
      else { document.getElementById("replay-btn").classList.add("d-none"); }
      
    // Scroll vers le résultat
    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// --- MODIFICATION : Affichage de la correction stylisée ---
function showUserAnswers() {
    const container = document.getElementById("correction-container");
    container.innerHTML = "<h3 class='text-center mb-5' style='color:var(--neon-cyan); font-family:Orbitron; text-transform:uppercase; letter-spacing:2px;'>📜 Analyse Détaillée des Réponses</h3>";
    questions.forEach((q, idx) => {
        const userSelected = userAnswers[q.id] || [];
        const correctAnswers = q.answers.filter(a => a.correct).map(a => a.id);
        let html = `<div class="correction-card"><h5 class="correction-q-title">Q${idx+1}. ${q.text}</h5><ul class="correction-list list-unstyled">`;
        q.answers.forEach(a => {
            const isUser = userSelected.includes(a.id), isCorrect = correctAnswers.includes(a.id);
            let color = isCorrect ? "text-success-neon" : (isUser ? "text-danger-neon" : "text-muted-neon");
            // Icônes FontAwesome pour la correction
            let icon = isCorrect ? "<i class='fas fa-check-circle me-3 fa-lg'></i>" : (isUser ? "<i class='fas fa-times-circle me-3 fa-lg'></i>" : "<i class='far fa-circle me-3 fa-lg' style='opacity:0.5'></i>");
            
            // Mise en surbrillance de la ligne si c'est la réponse de l'utilisateur ou la bonne réponse manquée
            let itemStyle = isUser || (isCorrect && !isUser) ? "background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);" : "";
            
            html += `<li class="${color}" style="${itemStyle}">${icon} <span>${a.text}</span></li>`;
        });
        html += "</ul></div>";
        container.innerHTML += html;
    });
    container.classList.remove("d-none");
}

function sendAnswersToServer() {
    const formData = new FormData();
    formData.append('attempt', attempt);
    formData.append('userAnswers', JSON.stringify(userAnswers));

    fetch("", {
        method: "POST", headers: { "X-CSRFToken": "{{ csrf_token }}", }, body: formData,
    })
    .then(response => response.json())
    .then(data => {
        if(data.success){ console.log("Réponses enregistrées."); }
        else { showMessage("Erreur lors de l'enregistrement des réponses.", "danger"); }
    })
    .catch(() => showMessage("Erreur réseau lors de l'enregistrement.", "danger"));
}

document.addEventListener("DOMContentLoaded", () => {
    renderQuestion(currentIndex);
    startTimer();

    document.getElementById("next-btn").addEventListener("click", () => {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        }
    });

    document.getElementById("prev-btn").addEventListener("click", () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion(currentIndex);
        }
    });

    document.getElementById("quiz-form").addEventListener("submit", (e) => {
        e.preventDefault();
        if (!submitted) {
            submitted = true;
            clearInterval(timerInterval);
            saveAnswer(true);
            showMessage("Transmission des réponses en cours... Analyse...", "success");
            showFinalMessage();
            showUserAnswers();
            sendAnswersToServer();
        }
    });

    document.getElementById("reset-score-btn").addEventListener("click", () => {
        score = 0; evaluatedQuestions = {}; userAnswers = {};
        document.getElementById("current_score").innerText = score;
        showMessage("Score local réinitialisé.", "info");
    });

    document.getElementById("replay-btn").addEventListener("click", () => {
        attempt++; submitted = false; userAnswers = {}; evaluatedQuestions = {}; score = 0; timeLeft = 600;
        clearInterval(timerInterval);
        // Reset de la barre de progression et ses couleurs
        const progressBar = document.getElementById("progress-bar");
        progressBar.style.width = "100%";
        progressBar.style.background = 'linear-gradient(90deg, var(--neon-cyan), var(--neon-purple))';
        progressBar.style.boxShadow = '0 0 15px var(--neon-cyan)';
        
        document.getElementById("final-message").classList.add("d-none");
        document.getElementById("post-submit-links").classList.add("d-none");
        document.getElementById("correction-container").classList.add("d-none");
        document.getElementById("replay-btn").classList.add("d-none");
        document.getElementById("message-area").innerHTML = "";
        document.getElementById("current_score").innerText = 0;
        renderQuestion(0);
        startTimer();
    });
});
</script>
{% endblock %}

{% extends "eduplay/base.html" %}
{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* --- STYLES GLOBAUX FUTURISTES --- */
    :root {
        --bg-dark: #050a1f;
        --bg-darker: #0d1229;
        --text-light: #e0e6ff;
        --neon-cyan: #00d2ff;
        --neon-green: #00ff99;
        --neon-purple: #bd00ff;
        --neon-red: #ff3366;
        --glass-bg: rgba(13, 18, 41, 0.7);
        --border-neon: 1px solid rgba(0, 210, 255, 0.3);
    }

    body {
        font-family: 'Roboto', sans-serif;
        background-color: var(--bg-dark);
        background-image:
            radial-gradient(circle at 50% 30%, var(--bg-darker) 0%, var(--bg-dark) 100%),
            url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2300d2ff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        color: var(--text-light);
        overflow-x: hidden;
        /* Espace vital pour la navigation fixe sur mobile afin qu'elle ne cache pas le contenu */
        padding-bottom: 80px;
    }

    h2, h3, h4, h5, .quiz-title, .stat-label, .question-text {
        font-family: 'Orbitron', sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* --- CONTENEUR PRINCIPAL --- */
    .quiz-container {
        max-width: 800px;
        margin: 30px auto;
        padding: 30px;
        background: var(--glass-bg);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px); /* Support Safari */
        border-radius: 25px;
        border: var(--border-neon);
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 210, 255, 0.1);
        position: relative;
    }

    /* --- EN-TÊTE DU QUIZ --- */
    .quiz-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        border-bottom: var(--border-neon);
        padding-bottom: 20px;
        flex-wrap: wrap; /* Permet le retour à la ligne sur petits écrans */
        gap: 20px;
    }
    .quiz-title {
        color: var(--neon-cyan);
        text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        margin: 0;
        font-size: 1.5rem;
        word-break: break-word; /* Évite que les longs mots ne dépassent */
    }

    .quiz-stats { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .stat-box {
        background: rgba(0, 210, 255, 0.1);
        padding: 10px 15px;
        border-radius: 12px;
        border: 1px solid var(--neon-cyan);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 90px; /* Largeur minimale pour la cohérence */
    }
    .stat-label { font-size: 0.8rem; color: var(--neon-cyan); margin-bottom: 5px; }
    .stat-value { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 700; color: #fff; }
    #current_score { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
    #timer { color: var(--neon-purple); text-shadow: 0 0 10px var(--neon-purple); }

    /* --- BARRE DE PROGRESSION --- */
    .timer-progress-container {
        height: 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 30px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .timer-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
        border-radius: 10px;
        box-shadow: 0 0 15px var(--neon-cyan);
        transition: width 1s linear, background 0.5s ease;
    }

    /* --- ZONE DE QUESTION --- */
    .question-card {
        background: rgba(15, 23, 42, 0.6);
        border: var(--border-neon);
        border-radius: 20px;
        padding: 25px;
        margin-bottom: 30px;
    }
    .question-number { color: var(--neon-cyan); font-size: 0.9rem; margin-bottom: 15px; display: block; }
    .question-text { font-size: 1.3rem; color: #fff; margin-bottom: 25px; line-height: 1.4; font-weight: 500; }

    /* --- OPTIONS DE RÉPONSE --- */
    .answer-options { display: flex; flex-direction: column; gap: 15px; }
    .answer-option-input { display: none; }

    .answer-option-label {
        display: flex;
        align-items: flex-start; /* Aligner l'icône en haut si le texte est long */
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(0, 210, 255, 0.3);
        border-radius: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1.1rem;
        color: var(--text-light);
        position: relative;
        overflow: hidden;
        line-height: 1.4; /* Meilleure lisibilité pour les textes longs */
    }
    .answer-option-label:hover {
        background: rgba(0, 210, 255, 0.1);
        border-color: var(--neon-cyan);
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
    }
    .answer-option-input:checked + .answer-option-label {
        background: rgba(0, 255, 153, 0.15);
        border-color: var(--neon-green);
        color: #fff;
        box-shadow: 0 0 20px rgba(0, 255, 153, 0.4);
    }
    .answer-option-label::before {
        content: '';
        display: inline-block;
        width: 22px; height: 22px;
        border: 2px solid var(--neon-cyan);
        border-radius: 50%;
        margin-right: 15px;
        margin-top: 2px; /* Ajustement optique pour l'alignement flex-start */
        transition: all 0.3s ease;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        flex-shrink: 0; /* Empêche l'icône de rétrécir si le texte est long */
    }
    .answer-option-input[type="checkbox"] + .answer-option-label::before { border-radius: 5px; }
    .answer-option-input:checked + .answer-option-label::before {
        background: var(--neon-green);
        border-color: var(--neon-green);
        box-shadow: 0 0 10px var(--neon-green);
    }
    .answer-option-input:disabled + .answer-option-label {
        opacity: 0.7; cursor: not-allowed; filter: grayscale(0.5);
    }

    /* --- BOUTONS DE NAVIGATION --- */
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 30px;
    }
    .btn-futuristic {
        flex: 1;
        padding: 15px 25px;
        border: none;
        border-radius: 12px;
        font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem;
        text-transform: uppercase; letter-spacing: 1px;
        cursor: pointer; transition: all 0.3s ease;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        white-space: nowrap; /* Empêche le texte du bouton de passer à la ligne */
    }
    .btn-prev {
        background: transparent; color: var(--neon-cyan); border: 2px solid var(--neon-cyan);
    }
    .btn-prev:hover:not(:disabled) {
        background: rgba(0, 210, 255, 0.2); box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); color: #fff;
    }
    .btn-next, .btn-submit {
        background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
        color: #050a1f; border: none;
        box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
    }
    .btn-next:hover:not(:disabled), .btn-submit:hover:not(:disabled) {
        box-shadow: 0 0 30px rgba(0, 255, 153, 0.6); transform: translateY(-3px);
    }
    .btn-futuristic:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; filter: grayscale(0.8); }

    /* --- MESSAGES & FEEDBACK --- */
    .alert-futuristic {
        background: rgba(13, 18, 41, 0.95);
        border: 2px solid;
        border-radius: 15px;
        padding: 20px;
        font-size: 1.1rem;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
    .alert-success { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 20px rgba(0, 255, 153, 0.3); }
    .alert-danger { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 20px rgba(255, 51, 102, 0.3); }
    .alert-info { border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 210, 255, 0.3); }

    /* --- CORRECTION --- */
    .correction-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px; padding: 20px; margin-bottom: 20px;
    }
    .correction-question { font-family: 'Orbitron'; color: var(--neon-cyan); margin-bottom: 15px; font-size: 1.1rem; }
    .correction-list li { margin-bottom: 10px; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.2); line-height: 1.4; }
    .text-success-neon { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
    .text-danger-neon { color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red); }
    .text-muted-neon { color: #aab2cd; opacity: 0.7; }

    /* =========================================
       RESPONSIVE OPTIMISÉ (MOBILE FIRST)
    ========================================= */
    @media (max-width: 768px) {
        /* Ajustements généraux du conteneur */
        .quiz-container {
            margin: 15px auto;
            padding: 20px;
            border-radius: 20px;
            width: 95%; /* Utilise plus de largeur sur petits écrans */
        }

        /* Header plus compact */
        .quiz-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }
        .quiz-title {
            font-size: 1.3rem;
            text-align: center;
            width: 100%;
        }
        .quiz-stats {
            width: 100%;
            justify-content: space-between;
            gap: 10px;
        }
        .stat-box {
            flex: 1; /* Les boîtes de stats se partagent l'espace */
            padding: 8px 10px;
            min-width: auto;
        }
        .stat-label { font-size: 0.75rem; }
        .stat-value { font-size: 1.3rem; }

        /* Timer et Question plus compacts */
        .timer-progress-container { margin-bottom: 20px; }
        .question-card { padding: 20px; margin-bottom: 20px; }
        .question-text { font-size: 1.15rem; margin-bottom: 20px; }

        /* Réponses optimisées pour le tactile */
        .answer-options { gap: 12px; }
        .answer-option-label {
            padding: 12px 15px;
            font-size: 1rem;
        }
        .answer-option-label::before {
            width: 20px; height: 20px; margin-right: 12px;
        }

        /* Navigation FIXE en bas optimisée */
        .nav-buttons-container {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(13, 18, 41, 0.98); /* Fond plus opaque */
            padding: 12px 15px;
            z-index: 1000;
            border-top: 2px solid var(--neon-cyan);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .nav-buttons {
            margin-top: 0;
            gap: 10px; /* Espace réduit entre les boutons */
        }
        .btn-futuristic {
            padding: 12px 15px; /* Zone de touche confortable */
            font-size: 0.95rem;
        }

        /* Ajustements des alertes et corrections */
        .alert-futuristic { padding: 15px; font-size: 1rem; }
        .alert-futuristic h3 { font-size: 1.3rem; } /* Réduit la taille des titres dans les alertes JS */
        .correction-card { padding: 15px; }
    }

    /* Ajustements supplémentaires pour les très petits écrans (ex: iPhone SE) */
    @media (max-width: 480px) {
        .quiz-container { padding: 15px; margin: 10px auto; }
        .btn-futuristic { padding: 10px 12px; font-size: 0.9rem; }
        .btn-futuristic i { display: none; } /* Cache les icônes des boutons pour gagner de la place si besoin */
    }
</style>

<div class="container-fluid p-0">
    <div class="quiz-container">
        <div class="quiz-header">
            <h2 class="quiz-title"><i class="fas fa-brain me-2"></i> Quiz : {{ domain }}</h2>
            <div class="quiz-stats">
                <div class="stat-box">
                    <span class="stat-label"><i class="fas fa-star me-1"></i> Score</span>
                    <span class="stat-value" id="current_score">0</span>
                </div>
                <div class="stat-box" style="border-color: var(--neon-purple);">
                    <span class="stat-label"><i class="fas fa-clock me-1"></i> Temps</span>
                    <span class="stat-value" id="timer">600</span>
                </div>
            </div>
        </div>

        <div class="timer-progress-container">
            <div id="progress-bar" class="timer-progress-bar" style="width: 100%;"></div>
        </div>

        <div id="message-area" class="mb-4"></div>

        <form id="quiz-form" method="post">
            {% csrf_token %}
            <div id="question-container">
                </div>

            <div class="nav-buttons-container">
                <div class="nav-buttons">
                    <button type="button" class="btn-futuristic btn-prev" id="prev-btn"><i class="fas fa-chevron-left"></i> Précédent</button>
                    <button type="button" class="btn-futuristic btn-next" id="next-btn" disabled>Suivant <i class="fas fa-chevron-right"></i></button>
                    <button type="submit" class="btn-futuristic btn-submit d-none" id="submit-btn" disabled><i class="fas fa-check-circle"></i> Soumettre</button>
                </div>
            </div>
        </form>

        <div id="final-message" class="alert-futuristic mt-4 d-none"></div>

        <div class="text-center mt-4 mb-5 pb-5"> <button type="button" id="replay-btn" class="btn-futuristic btn-prev d-none" style="margin: auto; border-color: var(--neon-green); color: var(--neon-green);"><i class="fas fa-redo-alt me-2"></i> Rejouer le quiz</button>
        </div>

        <div id="post-submit-links" class="mt-4 d-none text-center mb-5 pb-5">
            <a href="{% url 'eduplay:answers_page' %}" class="btn-futuristic btn-prev" style="display: inline-flex; width: auto; border-color: var(--neon-purple); color: var(--neon-purple); text-decoration: none;"><i class="fas fa-list-alt me-2"></i> Voir la correction détaillée</a>
        </div>

        <div id="correction-container" class="mt-5 d-none mb-5 pb-5"></div>
    </div>
</div>

<script>
    // =================================================================
    // NOTE : Le script JS est identique à celui que tu as fourni.
    // J'ai juste changé la façon dont le HTML des réponses est généré
    // dans la fonction renderQuestion() pour utiliser les nouveaux styles.
    // =================================================================

const questions = [
    {% for q in questions %}
    {
        id: {{ q.id }},
        text: `{{ q.question_text|escapejs }}`,
        multiple: {{ q.multiple_answers|yesno:"true,false" }},
        answers: [
            {% for a in q.answers.all %}
            { id: {{ a.id }}, text: `{{ a.answer_text|escapejs }}`, correct: {{ a.is_correct|yesno:"true,false" }} },
            {% endfor %}
        ]
    },
    {% endfor %}
];

let currentIndex = 0, score = 0, submitted = false;
let userAnswers = {}, evaluatedQuestions = {};
let timeLeft = 600, timerInterval;
let attempt = 1;

function startTimer() {
    const timerEl = document.getElementById("timer");
    const progressBar = document.getElementById("progress-bar");
    const totalTime = 600; // Valeur initiale fixe

    timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        progressBar.style.width = (timeLeft / totalTime) * 100 + "%";

        // Changement de couleur de la barre à la fin
        if (timeLeft < 60) {
             progressBar.style.background = 'linear-gradient(90deg, var(--neon-red), var(--neon-purple))';
             progressBar.style.boxShadow = '0 0 15px var(--neon-red)';
        }

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            if (!submitted) {
                submitted = true;
                showMessage("⏳ Temps écoulé ! Quiz terminé automatiquement.", "danger");
                saveAnswer(true);
                showFinalMessage();
                showUserAnswers();
                renderQuestion(currentIndex);
                sendAnswersToServer();
            }
        }
    }, 1000);
}

function showMessage(text, type="info") {
    document.getElementById("message-area").innerHTML = `<div class="alert-futuristic alert-${type}"><i class="fas fa-info-circle me-2"></i> ${text}</div>`;
    // Scroll vers le message sur mobile si besoin
    document.getElementById("message-area").scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// --- MODIFICATION PRINCIPALE DANS LE JS ICI ---
function renderQuestion(index) {
    const q = questions[index];
    const container = document.getElementById("question-container");
    
    let html = `
        <div class="question-card">
            <span class="question-number"><i class="fas fa-question-circle me-1"></i> Question ${index + 1} / ${questions.length}</span>
            <h3 class="question-text">${q.text}</h3>
            <div class="answer-options">
    `;

    q.answers.forEach(a => {
        const inputType = q.multiple ? "checkbox" : "radio";
        const nameAttr = q.multiple ? `answers_${q.id}[]` : `answers_${q.id}`;
        const checked = userAnswers[q.id]?.includes(a.id) ? "checked" : "";
        const disabled = submitted ? "disabled" : "";

        // NOUVELLE STRUCTURE HTML POUR LES RÉPONSES STYLISÉES
        html += `
            <div>
                <input class="answer-option-input" type="${inputType}" name="${nameAttr}" value="${a.id}" id="answer_${a.id}" ${checked} ${disabled}>
                <label class="answer-option-label" for="answer_${a.id}">
                    ${a.text}
                </label>
            </div>
        `;
    });

    html += `</div></div>`; // Fin .answer-options et .question-card
    container.innerHTML = html;

    document.getElementById("prev-btn").disabled = submitted || index === 0;
    document.getElementById("next-btn").classList.toggle("d-none", index === questions.length - 1);
    document.getElementById("submit-btn").classList.toggle("d-none", index !== questions.length - 1);
    toggleNextButton();

    if (!submitted) {
        // On cible les nouveaux inputs cachés
        document.querySelectorAll(".answer-option-input").forEach(input =>
            input.addEventListener("change", () => {
                saveAnswer(false);
                evaluateCurrentQuestion();
                toggleNextButton();
            })
        );
    }
    // Scroll en haut du conteneur de question sur mobile lors du changement
    window.scrollTo({ top: container.offsetTop - 20, behavior: 'smooth' });
}

function toggleNextButton() {
    // On cible les nouveaux inputs cachés
    const selected = document.querySelectorAll('.answer-option-input:checked');
    document.getElementById("next-btn").disabled = selected.length === 0 || submitted;
    if (currentIndex === questions.length - 1) {
        document.getElementById("submit-btn").disabled = selected.length === 0 || submitted;
    }
}

function saveAnswer(evaluate=false) {
    const q = questions[currentIndex];
    const name = q.multiple ? `answers_${q.id}[]` : `answers_${q.id}`;
    userAnswers[q.id] = Array.from(document.querySelectorAll(`[name="${name}"]:checked`)).map(i => parseInt(i.value));
    if (evaluate) evaluateAllAnswers();
}

function evaluateAllAnswers() {
    score = 0;
    evaluatedQuestions = {};
    for (let q of questions) {
        const selected = userAnswers[q.id] || [];
        const correctAnswers = q.answers.filter(a => a.correct).map(a => a.id).sort();
        const userSorted = [...selected].sort();
        const isCorrect = JSON.stringify(correctAnswers) === JSON.stringify(userSorted);
        evaluatedQuestions[q.id] = isCorrect;
        score += isCorrect ? 1 : 0;
    }
    document.getElementById("current_score").innerText = score;
}

function evaluateCurrentQuestion() {
    const q = questions[currentIndex];
    const selected = userAnswers[q.id] || [];
    const correctAnswers = q.answers.filter(a => a.correct).map(a => a.id).sort();
    const userSorted = [...selected].sort();
    const isCorrect = JSON.stringify(correctAnswers) === JSON.stringify(userSorted);
    evaluatedQuestions[q.id] = isCorrect;
    score = Object.values(evaluatedQuestions).filter(v => v).length;
    document.getElementById("current_score").innerText = score;
}

function showFinalMessage() {
    evaluateAllAnswers();
    const total = questions.length;
    const msg = document.getElementById("final-message");
    // Icônes et messages personnalisés
    let icon = score === total ? "🏆" : score >= total-3 ? "👍" : "💪";
    let message = score === total ? "Excellent ! Un sans-faute légendaire !" :
                  score >= total-3 ? `Bien joué ! ${total-score} petite(s) erreur(s).` :
                  score >= total-5 ? `Pas mal. ${total-score} erreur(s) à corriger.` :
                                     `Continuez vos efforts. ${total-score} erreur(s).`;
    msg.className = "alert-futuristic mt-4 " + (score === total ? "alert-success" :
                    score >= total-3 ? "alert-info" : "alert-danger");
    // Utilisation de balises h3/h4 qui seront stylisées par le CSS responsive
    msg.innerHTML = `<h3>${icon} Résultat Final</h3><p>${message}</p><h4 class="mt-3">Score : <span style="color:var(--neon-green)">${score}</span> / ${total}</h4>`;
    msg.classList.remove("d-none");

    document.getElementById("post-submit-links").classList.remove("d-none");
    if (attempt === 1) { document.getElementById("replay-btn").classList.remove("d-none"); }
      else { document.getElementById("replay-btn").classList.add("d-none"); }
      
    // Scroll vers le résultat final
    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// --- MODIFICATION DE L'AFFICHAGE DE LA CORRECTION ---
function showUserAnswers() {
    const container = document.getElementById("correction-container");
    container.innerHTML = "<h3 style='color:var(--neon-cyan); text-align:center; margin-bottom:30px; font-family:Orbitron;'>📜 Détail des Réponses</h3>";
    questions.forEach((q, idx) => {
        const userSelected = userAnswers[q.id] || [];
        const correctAnswers = q.answers.filter(a => a.correct).map(a => a.id);
        let html = `<div class="correction-card"><h5 class="correction-question">Q${idx+1}. ${q.text}</h5><ul class="correction-list list-unstyled">`;
        q.answers.forEach(a => {
            const isUser = userSelected.includes(a.id), isCorrect = correctAnswers.includes(a.id);
            let color = isCorrect ? "text-success-neon" : (isUser ? "text-danger-neon" : "text-muted-neon");
            let icon = isCorrect ? "<i class='fas fa-check-circle me-2'></i>" : (isUser ? "<i class='fas fa-times-circle me-2'></i>" : "<i class='far fa-circle me-2' style='opacity:0.5'></i>");
            html += `<li class="${color}">${icon} ${a.text}</li>`;
        });
        html += "</ul></div>";
        container.innerHTML += html;
    });
    container.classList.remove("d-none");
}

function sendAnswersToServer() {
    const formData = new FormData();
    formData.append('attempt', attempt);
    formData.append('userAnswers', JSON.stringify(userAnswers));

    fetch("", {
        method: "POST",
        headers: { "X-CSRFToken": "{{ csrf_token }}", },
        body: formData,
    })
    .then(response => response.json())
    .then(data => {
        if(data.success){ console.log("Réponses enregistrées."); }
        else { showMessage("Erreur lors de l'enregistrement des réponses.", "danger"); }
    })
    .catch(() => showMessage("Erreur réseau lors de l'enregistrement.", "danger"));
}

document.addEventListener("DOMContentLoaded", () => {
    renderQuestion(currentIndex);
    startTimer();

    document.getElementById("next-btn").addEventListener("click", () => {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        }
    });

    document.getElementById("prev-btn").addEventListener("click", () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion(currentIndex);
        }
    });

    document.getElementById("quiz-form").addEventListener("submit", (e) => {
        e.preventDefault();
        if (!submitted) {
            submitted = true;
            clearInterval(timerInterval);
            saveAnswer(true);
            showMessage("Quiz soumis avec succès. Analyse en cours...", "success");
            showFinalMessage();
            showUserAnswers();
            sendAnswersToServer();
        }
    });

    // Bouton reset supprimé du HTML pour simplifier, mais le code JS peut rester

    document.getElementById("replay-btn").addEventListener("click", () => {
        attempt++;
        submitted = false;
        userAnswers = {};
        evaluatedQuestions = {};
        score = 0;
        timeLeft = 600;
        clearInterval(timerInterval);
        document.getElementById("progress-bar").style.width = "100%";
        document.getElementById("progress-bar").style.background = 'linear-gradient(90deg, var(--neon-cyan), var(--neon-purple))';
        document.getElementById("final-message").classList.add("d-none");
        document.getElementById("post-submit-links").classList.add("d-none");
        document.getElementById("correction-container").classList.add("d-none");
        document.getElementById("replay-btn").classList.add("d-none");
        document.getElementById("message-area").innerHTML = "";
        document.getElementById("current_score").innerText = 0;
        renderQuestion(0);
        startTimer();
        // Scroll en haut lors du rejeu
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
});
</script>
{% endblock %}

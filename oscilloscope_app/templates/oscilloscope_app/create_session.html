<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouvelle Session — Founatek OSC</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#060e1a;
  font-family:'JetBrains Mono',monospace;
  color:#8ab4cc;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

/* Grille de fond subtile */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

.card{
  background:#0a1628;
  border:1px solid #0e2a4a;
  border-radius:10px;
  padding:clamp(20px, 5vw, 36px);
  width:100%;
  max-width:460px;
  position:relative;
  box-shadow:0 0 40px rgba(0,212,255,.05);
}

/* Accent coin supérieur gauche */
.card::before{
  content:'';
  position:absolute;
  top:-1px; left:-1px;
  width:60px; height:60px;
  border-top:2px solid #00d4ff;
  border-left:2px solid #00d4ff;
  border-radius:10px 0 0 0;
}

h2{
  font-family:'Orbitron',sans-serif;
  color:#00d4ff;
  font-size:clamp(.8rem, 3vw, 1rem);
  margin-bottom:clamp(18px, 4vw, 28px);
  letter-spacing:1px;
  padding-left:4px;
}

.row{margin-bottom:clamp(10px, 3vw, 16px);}

label{
  display:block;
  font-size:clamp(.55rem, 2vw, .65rem);
  color:#2d6080;
  letter-spacing:1.5px;
  margin-bottom:6px;
  text-transform:uppercase;
}

input, select, textarea{
  width:100%;
  background:#0d1e35;
  border:1px solid #0e2a4a;
  color:#d0e8f8;
  padding:clamp(7px, 2vw, 10px) clamp(8px, 2vw, 12px);
  border-radius:4px;
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(.68rem, 2.5vw, .78rem);
  outline:none;
  transition:border-color .2s, box-shadow .2s;
  -webkit-appearance:none;
  appearance:none;
}

input:focus, select:focus, textarea:focus{
  border-color:#00d4ff;
  box-shadow:0 0 0 2px rgba(0,212,255,.08);
}

/* Flèche custom pour select */
.select-wrap{position:relative;}
.select-wrap::after{
  content:'▾';
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  color:#00d4ff;
  font-size:.7rem;
  pointer-events:none;
}

select{padding-right:28px;}

textarea{resize:vertical;min-height:70px;}

/* Badge source */
.source-info{
  display:none;
  margin-top:6px;
  font-size:.6rem;
  color:#1e5070;
  padding:5px 8px;
  background:rgba(0,212,255,.04);
  border-left:2px solid #0e4060;
  border-radius:0 3px 3px 0;
}
.source-info.visible{display:block;}

.btns{
  display:flex;
  gap:10px;
  margin-top:clamp(16px, 4vw, 24px);
  flex-wrap:wrap;
}

.btn-c{
  padding:clamp(9px, 2.5vw, 11px) clamp(12px, 3vw, 18px);
  background:transparent;
  border:1px solid #0e2a4a;
  color:#3d6080;
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(.65rem, 2.5vw, .75rem);
  cursor:pointer;
  border-radius:4px;
  transition:.2s;
  text-decoration:none;
  display:flex;
  align-items:center;
  white-space:nowrap;
}
.btn-c:hover{border-color:#1e4060;color:#5d80a0;}

.btn-p{
  flex:1;
  padding:clamp(9px, 2.5vw, 11px);
  background:rgba(0,212,255,.1);
  border:1px solid #00d4ff;
  color:#00d4ff;
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(.65rem, 2.5vw, .75rem);
  cursor:pointer;
  border-radius:4px;
  letter-spacing:1px;
  transition:.2s;
  white-space:nowrap;
  min-width:140px;
}
.btn-p:hover{background:rgba(0,212,255,.2); box-shadow:0 0 12px rgba(0,212,255,.15);}
.btn-p:active{transform:scale(.98);}

/* Mobile : boutons full width */
@media(max-width:360px){
  .btns{flex-direction:column;}
  .btn-c, .btn-p{width:100%; justify-content:center; text-align:center;}
}
</style>
</head>
<body>
<div class="card">
  <h2>+ Nouvelle Session</h2>
  <form method="POST">
    {% csrf_token %}

    <div class="row">
      <label>Nom de la session</label>
      <input type="text" name="name" placeholder="Ex: Analyse filtre RC 100Hz" required>
    </div>

    <div class="row">
      <label>Source de données</label>
      <div class="select-wrap">
        <select name="source" id="sourceSelect" onchange="updateSourceInfo()">
          <option value="sim">Simulateur interne</option>
          <option value="wifi">ESP32 / ESP8266 via WiFi</option>
          <option value="serial">Arduino via port Série</option>
        </select>
      </div>
      <div class="source-info" id="sourceInfo"></div>
    </div>

    <div class="row">
      <label>Description (optionnel)</label>
      <textarea name="description" rows="3" placeholder="Ex: Étude d'un filtre passe-bas RC avec R=1kΩ C=10µF"></textarea>
    </div>

    <div class="btns">
      <a href="{% url 'oscilloscope:home' %}" class="btn-c">✕ Annuler</a>
      <button type="submit" class="btn-p">▶ Créer et ouvrir</button>
    </div>
  </form>
</div>

<script>
const hints = {
  sim:    '⚡ Génération de signaux mathématiques — aucun matériel requis.',
  wifi:   '📡 ESP32 doit être connecté au même réseau et configuré avec votre token.',
  serial: '🔌 Branchez l\'Arduino via USB et lancez serial_bridge.py sur votre PC.'
};
function updateSourceInfo(){
  const sel = document.getElementById('sourceSelect').value;
  const box = document.getElementById('sourceInfo');
  box.textContent = hints[sel] || '';
  box.classList.toggle('visible', !!hints[sel]);
}
updateSourceInfo();
</script>
</body>
</html>

{% extends "product_transparency/base.html" %}
{% load static %}

{% block title %}Scan produit{% endblock %}

{% block content %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root {
    --neon-blue: #00d2ff;
    --neon-green: #00ff99;
    --neon-red: #ff3366;
    --bg-dark: #050a1f;
    --card-bg: rgba(13,18,41,.92);
    --text-primary: #e0e6ff;
    --text-secondary: #aab2cd;
}

body {
    font-family: 'Roboto', sans-serif;
    background-color: var(--bg-dark);
    background-image:
        linear-gradient(rgba(0,210,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,210,255,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.cyber-scanner-card {
    width: 100%;
    max-width: 460px;
    background: var(--card-bg);
    border: 2px solid var(--neon-blue);
    border-radius: 22px;
    padding: 30px 25px;
    box-shadow: 0 0 35px rgba(0,210,255,.35);
    text-align: center;
    backdrop-filter: blur(12px);
}

.card-header-icon {
    font-size: 3rem;
    color: var(--neon-blue);
    margin-bottom: 10px;
}

#company-logo {
    display: none;
    max-height: 65px;
    margin: 10px auto;
}

#product-image {
    display: none;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 16px;
    margin: 15px 0;
    box-shadow: 0 0 25px rgba(0,210,255,.4);
}

h2#name {
    font-family: 'Orbitron', sans-serif;
    color: #fff;
    margin: 15px 0 5px;
}

.company-info {
    color: var(--text-secondary);
    margin-bottom: 20px;
}

.price-box {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.5rem;
    color: var(--neon-green);
    margin: 25px 0;
    padding: 15px 0;
    border-top: 1px dashed rgba(0,210,255,.35);
    border-bottom: 1px dashed rgba(0,210,255,.35);
}

.info-row {
    display: flex;
    justify-content: space-between;
    background: rgba(0,210,255,.06);
    padding: 10px 15px;
    border-radius: 10px;
    margin-bottom: 12px;
    color: var(--text-secondary);
}

.status-container {
    margin-top: 25px;
}

.status-badge {
    padding: 14px;
    border-radius: 50px;
    font-family: 'Orbitron', sans-serif;
    font-weight: bold;
    text-transform: uppercase;
}

.status-valid {
    color: var(--neon-green);
    border: 2px solid var(--neon-green);
}

.status-expired {
    color: var(--neon-red);
    border: 2px solid var(--neon-red);
}
</style>

<div class="cyber-scanner-card">

    <div class="card-header-icon">
        <i class="fas fa-qrcode"></i>
    </div>

    <img id="company-logo" alt="Logo entreprise">
    <img id="product-image" alt="Image produit">

    <h2 id="name">Chargement…</h2>

    <div class="company-info">
        <i class="fas fa-building"></i>
        <span id="company">---</span>
    </div>

    <div id="price" class="price-box">---</div>

    <div class="info-row">
        <span>Production</span>
        <span id="production">---</span>
    </div>

    <div class="info-row">
        <span>Expiration</span>
        <span id="expiry">---</span>
    </div>

    <div id="status-container" class="status-container">
        <div class="status-badge" style="border:2px dashed var(--text-secondary);color:var(--text-secondary)">
            Analyse en cours…
        </div>
    </div>

</div>

<script>
/* 🔥 UUID EXACT */
const uuid = window.location.pathname.split("/").filter(Boolean).pop();

/* 🔥 URL DJANGO EXACTE (PAS DE DEVINETTE) */
const apiUrl = `/product_transparency/api/public/products/${uuid}/`;

fetch(apiUrl)
    .then(res => {
        if (!res.ok) throw new Error("404");
        return res.json();
    })
    .then(data => {
        document.getElementById("name").innerText = data.name;
        document.getElementById("company").innerText = data.company;
        document.getElementById("price").innerText = `${data.price} ${data.currency}`;
        document.getElementById("production").innerText = data.production_date;
        document.getElementById("expiry").innerText = data.expiry_date;

        if (data.image) {
            const img = document.getElementById("product-image");
            img.src = data.image;
            img.style.display = "block";
        }

        if (data.company_logo) {
            const logo = document.getElementById("company-logo");
            logo.src = data.company_logo;
            logo.style.display = "block";
        }

        document.getElementById("status-container").innerHTML =
            data.status === "VALIDE"
                ? `<div class="status-badge status-valid">PRODUIT VALIDE</div>`
                : `<div class="status-badge status-expired">PRODUIT EXPIRÉ</div>`;
    })
    .catch(() => {
        document.querySelector(".cyber-scanner-card").innerHTML = `
            <i class="fas fa-times-circle fa-3x" style="color:#ff3366"></i>
            <h2 style="color:#ff3366;font-family:Orbitron">Erreur de Scan</h2>
            <p style="color:#aab2cd">Produit introuvable ou supprimé.</p>
        `;
    });
</script>

{% endblock %}

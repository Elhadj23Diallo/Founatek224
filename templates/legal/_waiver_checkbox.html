{# Case obligatoire avant le paiement d'un contenu numérique (art. L221-28, 13° du Code de la consommation). #}
<label class="waiver-check" style="display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:.9rem;line-height:1.45;color:#c4d6df;max-width:560px;text-align:left">
  <input type="checkbox" id="accept-conditions" name="accept_conditions" value="1" required style="margin-top:4px;width:18px;height:18px;flex:none">
  <span>J'accepte les <a href="{% url 'legal_cgv' %}" target="_blank" rel="noopener" style="color:#60dffa">conditions générales de vente</a>.
  Je demande l'accès immédiat au contenu numérique et je renonce expressément à mon droit de rétractation.</span>
</label>

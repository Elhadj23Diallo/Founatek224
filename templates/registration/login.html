{% extends 'base.html' %}
{% block title %}Connexion — FOUNATEK SHOP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-0 shadow">
      <div class="card-body p-4">
        <h3 class="text-center mb-4"><i class="bi bi-person-circle me-2"></i>Connexion</h3>
        <form method="post">
          {% csrf_token %}
          {% if form.errors %}
            <div class="alert alert-danger">Identifiant ou mot de passe incorrect.</div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label">Nom d'utilisateur</label>
            <input type="text" name="username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-warning w-100 btn-lg">Se connecter</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

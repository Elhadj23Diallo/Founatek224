<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 340' width='900' height='340' font-family='Arial, Helvetica, sans-serif'><rect width='900' height='340' fill='white'/><text x='24' y='34' font-size='20' fill='#0f172a' text-anchor='start' font-weight='bold'>Le principe capacitif : le doigt ajoute une petite capacité</text><rect x='60' y='190' width='280' height='26' rx='4' fill='#b45309'/><text x='200' y='245' font-size='16' fill='#0f172a' text-anchor='middle' font-weight='normal'>pastille de cuivre</text><rect x='40' y='170' width='320' height='16' rx='4' fill='#bfdbfe' opacity='0.8'/><text x='380' y='182' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>plastique ou verre fin</text><path d='M160,60 C160,40 240,40 240,60 L240,160 C240,172 160,172 160,160 Z' fill='#fcd34d' stroke='#b45309' stroke-width='2'/><text x='200' y='112' font-size='16' fill='#0f172a' text-anchor='middle' font-weight='bold'>doigt</text><line x1='175' y1='164' x2='175' y2='190' stroke='#0369a1' stroke-width='2' stroke-dasharray='4 3'/><line x1='200' y1='164' x2='200' y2='190' stroke='#0369a1' stroke-width='2' stroke-dasharray='4 3'/><line x1='225' y1='164' x2='225' y2='190' stroke='#0369a1' stroke-width='2' stroke-dasharray='4 3'/><text x='560' y='110' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>sans doigt : capacité C ≈ quelques pF</text><text x='560' y='140' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>avec doigt : C augmente</text><text x='560' y='170' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>la puce TTP223 mesure ce changement</text><text x='560' y='200' font-size='16' fill='#15803d' text-anchor='start' font-weight='bold'>→ SIG passe à HIGH (≈ 60 ms)</text><text x='560' y='250' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>calibrage à la mise sous tension :</text><text x='560' y='274' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>ne pas toucher la pastille à ce moment</text></svg>
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 360' width='980' height='360' font-family='Arial, Helvetica, sans-serif'><rect width='980' height='360' fill='white'/><text x='24' y='34' font-size='20' fill='#0f172a' text-anchor='start' font-weight='bold'>Le mini serveur web : une adresse = une action</text><rect x='30' y='90' width='230' height='130' rx='12' fill='#f1f5f9' stroke='#64748b' stroke-width='2'/><text x='145.0' y='140.0' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='bold'>Téléphone</text><text x='145.0' y='161.0' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>navigateur :</text><text x='145.0' y='182.0' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>http://192.168.1.42/on</text><rect x='380' y='90' width='250' height='130' rx='12' fill='#dbeafe' stroke='#2563eb' stroke-width='2'/><text x='505.0' y='140.0' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='bold'>ESP32 (port 80)</text><text x='505.0' y='161.0' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>serveur.on("/on", …)</text><text x='505.0' y='182.0' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>serveur.on("/off", …)</text><rect x='750' y='90' width='200' height='130' rx='12' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='850.0' y='140.0' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='bold'>GPIO 23</text><text x='850.0' y='161.0' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>digitalWrite(23, HIGH)</text><text x='850.0' y='182.0' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>LED allumée</text><line x1='260' y1='130' x2='378' y2='130' stroke='#2563eb' stroke-width='2.4'/><polygon points='378,130 366.94726807196537,134.6730201077038 366.94726807196537,125.3269798922962' fill='#2563eb'/><text x='319' y='118' font-size='14' fill='#2563eb' text-anchor='middle' font-weight='normal'>requête</text><line x1='380' y1='185' x2='262' y2='185' stroke='#ea580c' stroke-width='2.4'/><polygon points='262,185 273.05273192803463,180.3269798922962 273.05273192803463,189.6730201077038' fill='#ea580c'/><text x='321' y='207' font-size='14' fill='#ea580c' text-anchor='middle' font-weight='normal'>« LED ON »</text><line x1='630' y1='155' x2='748' y2='155' stroke='#16a34a' stroke-width='2.4'/><polygon points='748,155 736.9472680719654,159.6730201077038 736.9472680719654,150.3269798922962' fill='#16a34a'/><text x='30' y='270' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>Téléphone et ESP32 doivent être sur le même réseau Wi-Fi (pas en données mobiles).</text><text x='30' y='296' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>Dans loop(), serveur.handleClient() regarde sans cesse si une requête est arrivée.</text><text x='30' y='322' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>L'adresse IP est affichée par le moniteur série (115200 bauds) au démarrage.</text></svg>
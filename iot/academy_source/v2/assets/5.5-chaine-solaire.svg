<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 300' width='1100' height='300' font-family='Arial, Helvetica, sans-serif'><rect width='1100' height='300' fill='white'/><text x='24' y='34' font-size='20' fill='#0f172a' text-anchor='start' font-weight='bold'>Un capteur autonome alimenté par le soleil</text><rect x='24' y='90' width='180' height='100' rx='14' fill='#fef3c7' stroke='#d97706' stroke-width='2.5'/><text x='114.0' y='132' font-size='18' fill='#0f172a' text-anchor='middle' font-weight='bold'>Panneau</text><text x='114.0' y='160' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>6 V · 2 W</text><line x1='208' y1='140' x2='228' y2='140' stroke='#0f172a' stroke-width='2.5'/><polygon points='236,140 225,134 225,146' fill='#0f172a'/><rect x='240' y='90' width='180' height='100' rx='14' fill='#dbeafe' stroke='#2563eb' stroke-width='2.5'/><text x='330.0' y='132' font-size='18' fill='#0f172a' text-anchor='middle' font-weight='bold'>TP4056</text><text x='330.0' y='160' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>charge CC/CV</text><line x1='424' y1='140' x2='444' y2='140' stroke='#0f172a' stroke-width='2.5'/><polygon points='452,140 441,134 441,146' fill='#0f172a'/><rect x='456' y='90' width='180' height='100' rx='14' fill='#dcfce7' stroke='#16a34a' stroke-width='2.5'/><text x='546.0' y='132' font-size='18' fill='#0f172a' text-anchor='middle' font-weight='bold'>18650</text><text x='546.0' y='160' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>3,0 à 4,2 V</text><line x1='640' y1='140' x2='660' y2='140' stroke='#0f172a' stroke-width='2.5'/><polygon points='668,140 657,134 657,146' fill='#0f172a'/><rect x='672' y='90' width='180' height='100' rx='14' fill='#ede9fe' stroke='#7c3aed' stroke-width='2.5'/><text x='762.0' y='132' font-size='18' fill='#0f172a' text-anchor='middle' font-weight='bold'>Régulateur</text><text x='762.0' y='160' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>3,3 V (HT7333)</text><line x1='856' y1='140' x2='876' y2='140' stroke='#0f172a' stroke-width='2.5'/><polygon points='884,140 873,134 873,146' fill='#0f172a'/><rect x='888' y='90' width='180' height='100' rx='14' fill='#fee2e2' stroke='#dc2626' stroke-width='2.5'/><text x='978.0' y='132' font-size='18' fill='#0f172a' text-anchor='middle' font-weight='bold'>ESP32</text><text x='978.0' y='160' font-size='15' fill='#0f172a' text-anchor='middle' font-weight='normal'>veille profonde</text><text x='222.0' y='216' font-size='13' fill='#64748b' text-anchor='middle' font-weight='normal'>IN+ / IN−</text><text x='438.0' y='216' font-size='13' fill='#64748b' text-anchor='middle' font-weight='normal'>B+ / B−</text><text x='654.0' y='216' font-size='13' fill='#64748b' text-anchor='middle' font-weight='normal'>OUT+ / OUT− du TP4056</text><text x='870.0' y='216' font-size='13' fill='#64748b' text-anchor='middle' font-weight='normal'>3V3 / GND</text><text x='24' y='262' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>Le jour, le panneau charge la batterie ; la nuit, la batterie alimente l'ESP32, qui dort entre deux mesures.</text></svg>
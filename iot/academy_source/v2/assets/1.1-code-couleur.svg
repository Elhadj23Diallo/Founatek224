<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 480' width='820' height='480' font-family='Arial, Helvetica, sans-serif'><rect width='820' height='480' fill='white'/><text x='20' y='34' font-size='17' fill='#0f172a' text-anchor='start' font-weight='bold'>Lire le code couleur : 2 chiffres, puis le nombre de zéros, puis la tolérance</text><line x1='30' y1='90' x2='330' y2='90' stroke='#94a3b8' stroke-width='4'/><rect x='95' y='70' width='170' height='40' rx='18' fill='#e7d3a8' stroke='#a16207' stroke-width='1.6'/><rect x='120' y='70' width='13' height='40' fill='#dc2626' stroke='#00000022'/><rect x='148' y='70' width='13' height='40' fill='#dc2626' stroke='#00000022'/><rect x='176' y='70' width='13' height='40' fill='#7c3f12' stroke='#00000022'/><rect x='232' y='70' width='13' height='40' fill='#c9a227'/><text x='350' y='84' font-size='15' fill='#0f172a' text-anchor='start' font-weight='bold'>rouge – rouge – marron – or</text><text x='350' y='106' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>22 et 1 zéro → 220 Ω  (± 5 %)</text><line x1='30' y1='172' x2='330' y2='172' stroke='#94a3b8' stroke-width='4'/><rect x='95' y='152' width='170' height='40' rx='18' fill='#e7d3a8' stroke='#a16207' stroke-width='1.6'/><rect x='120' y='152' width='13' height='40' fill='#7c3f12' stroke='#00000022'/><rect x='148' y='152' width='13' height='40' fill='#111827' stroke='#00000022'/><rect x='176' y='152' width='13' height='40' fill='#dc2626' stroke='#00000022'/><rect x='232' y='152' width='13' height='40' fill='#c9a227'/><text x='350' y='166' font-size='15' fill='#0f172a' text-anchor='start' font-weight='bold'>marron – noir – rouge – or</text><text x='350' y='188' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>10 et 2 zéros → 1 000 Ω = 1 kΩ  (± 5 %)</text><line x1='30' y1='254' x2='330' y2='254' stroke='#94a3b8' stroke-width='4'/><rect x='95' y='234' width='170' height='40' rx='18' fill='#e7d3a8' stroke='#a16207' stroke-width='1.6'/><rect x='120' y='234' width='13' height='40' fill='#facc15' stroke='#00000022'/><rect x='148' y='234' width='13' height='40' fill='#7c3aed' stroke='#00000022'/><rect x='176' y='234' width='13' height='40' fill='#dc2626' stroke='#00000022'/><rect x='232' y='234' width='13' height='40' fill='#c9a227'/><text x='350' y='248' font-size='15' fill='#0f172a' text-anchor='start' font-weight='bold'>jaune – violet – rouge – or</text><text x='350' y='270' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>47 et 2 zéros → 4 700 Ω = 4,7 kΩ  (± 5 %)</text><line x1='30' y1='336' x2='330' y2='336' stroke='#94a3b8' stroke-width='4'/><rect x='95' y='316' width='170' height='40' rx='18' fill='#e7d3a8' stroke='#a16207' stroke-width='1.6'/><rect x='120' y='316' width='13' height='40' fill='#7c3f12' stroke='#00000022'/><rect x='148' y='316' width='13' height='40' fill='#111827' stroke='#00000022'/><rect x='176' y='316' width='13' height='40' fill='#f97316' stroke='#00000022'/><rect x='232' y='316' width='13' height='40' fill='#c9a227'/><text x='350' y='330' font-size='15' fill='#0f172a' text-anchor='start' font-weight='bold'>marron – noir – orange – or</text><text x='350' y='352' font-size='15' fill='#64748b' text-anchor='start' font-weight='normal'>10 et 3 zéros → 10 000 Ω = 10 kΩ  (± 5 %)</text><rect x='30' y='402' width='26' height='26' rx='4' fill='#111827' stroke='#94a3b8'/><text x='43' y='446' font-size='14' fill='#0f172a' text-anchor='middle' font-weight='bold'>0</text><text x='61' y='421' font-size='12' fill='#64748b' text-anchor='start' font-weight='normal'>noir</text><rect x='108' y='402' width='26' height='26' rx='4' fill='#7c3f12' stroke='#94a3b8'/><text x='121' y='446' font-size='14' fill='#0f172a' text-anchor='middle' font-weight='bold'>1</text><text x='139' y='421' font-size='12' fill='#64748b' text-anchor='start' font-weight='normal'>marron</text><rect x='186' y='402' width='26' height='26' rx='4' fill='#dc2626' stroke='#94a3b8'/><text x='199' y='446' font-size='14' fill='#0f172a' text-anchor='middle' font-weight='bold'>2</text><text x='217' y='421' font-size='12' fill='#64748b' text-anchor='start' font-weight='normal'>rouge</text><rect x='264' y='402' width='26' height='26' rx='4' fill='#f97316' stroke='#94a3b8'/><text x='277' y='446' font-size='14' fill='#0f172a' text-anchor='middle' font-weight='bold'>3</text><text x='295' y='421' font-size='12' fill='#64748b' text-anchor='start' font-weight='normal'>orange</text><rect x='342' y='402' width='26' height='26' rx='4' fill='#facc15' stroke='#94a3b8'/><text x='355' y='446' font-size='14' fill='#0f172a' text-anchor='middle' font-weight='bold'>4</text><text x='373' y='421' font-size='12' fill='#64748b' text-anchor='start' font-weight='normal'>jaune</text><rect x='420' y='402' width='26' height='26' rx='4' fill='#16a34a' stroke='#94a3b8'/><text x='433' y='446' font-size='14' fill='#0f172a' text-anchor='middle' font-weight='bold'>5</text><text x='451' y='421' font-size='12' fill='#64748b' text-anchor='start' font-weight='normal'>vert</text><rect x='498' y='402' width='26' height='26' rx='4' fill='#2563eb' stroke='#94a3b8'/><text x='511' y='446' font-size='14' fill='#0f172a' text-anchor='middle' font-weight='bold'>6</text><text x='529' y='421' font-size='12' fill='#64748b' text-anchor='start' font-weight='normal'>bleu</text><rect x='576' y='402' width='26' height='26' rx='4' fill='#7c3aed' stroke='#94a3b8'/><text x='589' y='446' font-size='14' fill='#0f172a' text-anchor='middle' font-weight='bold'>7</text><text x='607' y='421' font-size='12' fill='#64748b' text-anchor='start' font-weight='normal'>violet</text><rect x='654' y='402' width='26' height='26' rx='4' fill='#9ca3af' stroke='#94a3b8'/><text x='667' y='446' font-size='14' fill='#0f172a' text-anchor='middle' font-weight='bold'>8</text><text x='685' y='421' font-size='12' fill='#64748b' text-anchor='start' font-weight='normal'>gris</text><rect x='732' y='402' width='26' height='26' rx='4' fill='#f8fafc' stroke='#94a3b8'/><text x='745' y='446' font-size='14' fill='#0f172a' text-anchor='middle' font-weight='bold'>9</text><text x='763' y='421' font-size='12' fill='#64748b' text-anchor='start' font-weight='normal'>blanc</text></svg>
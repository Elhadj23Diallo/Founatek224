oke-width='2'/><text x='560' y='317' font-size='20' fill='#0f172a' text-anchor='middle' font-weight='bold'>C</text><line x1='584' y1='310' x2='590' y2='310' stroke='#64748b' stroke-width='2' stroke-dasharray='3 2'/><rect x='236' y='384' width='48' height='48' rx='8' fill='#f1f5f9' stroke='#94a3b8' stroke-width='2'/><text x='260' y='417' font-size='20' fill='#0f172a' text-anchor='middle' font-weight='bold'>*</text><line x1='284' y1='410' x2='290' y2='410' stroke='#64748b' stroke-width='2' stroke-dasharray='3 2'/><rect x='336' y='384' width='48' height='48' rx='8' fill='#f1f5f9' stroke='#94a3b8' stroke-width='2'/><text x='360' y='417' font-size='20' fill='#0f172a' text-anchor='middle' font-weight='bold'>0</text><line x1='384' y1='410' x2='390' y2='410' stroke='#64748b' stroke-width='2' stroke-dasharray='3 2'/><rect x='436' y='384' width='48' height='48' rx='8' fill='#f1f5f9' stroke='#94a3b8' stroke-width='2'/><text x='460' y='417' font-size='20' fill='#0f172a' text-anchor='middle' font-weight='bold'>#</text><line x1='484' y1='410' x2='490' y2='410' stroke='#64748b' stroke-width='2' stroke-dasharray='3 2'/><rect x='536' y='384' width='48' height='48' rx='8' fill='#f1f5f9' stroke='#94a3b8' stroke-width='2'/><text x='560' y='417' font-size='20' fill='#0f172a' text-anchor='middle' font-weight='bold'>D</text><line x1='584' y1='410' x2='590' y2='410' stroke='#64748b' stroke-width='2' stroke-dasharray='3 2'/><text x='720' y='120' font-size='18' fill='#0f172a' text-anchor='start' font-weight='bold'>Appui sur « 5 » :</text><text x='720' y='150' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>la ligne L2 touche la colonne C2.</text><text x='720' y='200' font-size='18' fill='#0f172a' text-anchor='start' font-weight='bold'>Le balayage :</text><text x='720' y='230' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>1. une colonne à LOW, les autres</text><text x='720' y='256' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>    en l'air</text><text x='720' y='282' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>2. on lit les 4 lignes (pull-up)</text><text x='720' y='308' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>3. ligne à LOW = touche trouvée</text><text x='720' y='334' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>4. colonne suivante, puis on</text><text x='720' y='360' font-size='16' fill='#0f172a' text-anchor='start' font-weight='normal'>    recommence sans cesse</text><text x='720' y='420' font-size='18' fill='#15803d' text-anchor='start' font-weight='bold'>16 touches = 4 × 4</text><text x='720' y='448' font-size='16' fill='#15803d' text-anchor='start' font-weight='normal'>avec 4 + 4 = 8 fils seulement</text></svg>
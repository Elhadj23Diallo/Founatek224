{% extends "techfeed/base.html" %}
{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
    body {
        background-color: #000; color: #fff; font-family: 'Roboto', sans-serif;
        margin: 0; padding: 0;
        display: flex; justify-content: center; align-items: center;
        min-height: 100vh;
    }
    
    .edit-container {
        width: 100%; max-width: 500px;
        padding: 20px;
        box-sizing: border-box;
    }

    h2 {
        font-family: 'Orbitron', sans-serif; color: #fff; text-align: center; margin-bottom: 30px;
        font-size: 1.5rem; letter-spacing: 1px;
    }

    /* Zone d'aperçu Avatar */
    .preview-wrapper {
        position: relative; width: 120px; height: 120px; margin: 0 auto 30px auto;
        cursor: pointer;
    }
    .preview-box {
        width: 100%; height: 100%; border-radius: 50%;
        border: 3px solid #333; overflow: hidden;
        background: #000; position: relative;
        box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
    }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .camera-overlay {
        position: absolute; bottom: 0; right: 0;
        background: #00d2ff; color: #000;
        width: 35px; height: 35px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        border: 3px solid #000;
    }

    /* Formulaire */
    .form-group { margin-bottom: 20px; }
    .form-group label {
        display: block; color: #00d2ff; margin-bottom: 8px;
        font-family: 'Orbitron', sans-serif; font-size: 0.9rem;
    }

    input[type="text"], textarea {
        width: 100%; padding: 15px;
        background: #1a1a1a; border: 1px solid #333;
        color: #fff; border-radius: 10px;
        font-family: 'Roboto', sans-serif; font-size: 1rem;
        box-sizing: border-box; transition: 0.3s;
    }
    input:focus, textarea:focus {
        border-color: #00d2ff; outline: none;
        box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
    }
    
    /* Input file caché */
    input[type=file] { display: none; }

    /* Boutons */
    .save-btn {
        background: linear-gradient(90deg, #00d2ff, #0077ff);
        border: none; padding: 15px; width: 100%;
        color: white; font-weight: bold; border-radius: 30px;
        cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        font-family: 'Orbitron'; margin-top: 10px;
    }
    .cancel-link {
        display: block; text-align: center; margin-top: 20px;
        color: #666; text-decoration: none; font-size: 0.9rem;
    }
</style>

<div class="edit-container">
    <h2>Éditer le Profil</h2>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <label for="id_avatar" class="preview-wrapper">
            <div class="preview-box">
                {% if profile.avatar %}
                    <img id="avatarPreview" src="{{ profile.avatar.url }}">
                {% else %}
                    <img id="avatarPreview" src="{% static 'images/default-avatar.png' %}">
                {% endif %}
            </div>
            <div class="camera-overlay"><i class="fas fa-camera"></i></div>
        </label>
        <input type="file" name="avatar" id="id_avatar" accept="image/*" onchange="previewImage(this)">

        <div class="form-group">
            <label>BIO</label>
            <textarea name="bio" rows="4" placeholder="Parle-nous de toi, tes compétences tech...">{{ profile.bio }}</textarea>
        </div>

        <div class="form-group">
            <label>TAGS / EXPERTISES</label>
            <input type="text" name="tags" value="{{ profile.tags }}" placeholder="#Python, #AI, #Robotics">
        </div>

        <button type="submit" class="save-btn">Enregistrer</button>
        <a href="{% url 'techfeed:profile' user.username %}" class="cancel-link">Annuler</a>
    </form>
</div>

<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('avatarPreview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}

{% extends "techfeed/base.html" %}
{% block content %}

<script type="module">
import {
  Room,
  createLocalAudioTrack,
  createLocalVideoTrack
} from "https://unpkg.com/livekit-client/dist/livekit-client.esm.mjs";

const LIVEKIT_URL = "{{ LIVEKIT_URL }}";
const TOKEN_URL = "{% url 'techfeed:call_livekit_token' call.room_name %}";

let room;
let audioTrack;
let videoTrack;
let started = false;

window.startCall = async function () {
  if (started) return;
  started = true;

  // 🔑 TOKEN
  const res = await fetch(TOKEN_URL);
  const { token } = await res.json();

  // 🔗 ROOM
  room = new Room();
  await room.connect(LIVEKIT_URL, token);

  // 🎤🎥 TRACKS LOCALES
  audioTrack = await createLocalAudioTrack();
  videoTrack = await createLocalVideoTrack();

  await room.localParticipant.publishTrack(audioTrack);
  await room.localParticipant.publishTrack(videoTrack);

  // 📷 VIDEO LOCALE
  const localVideo = document.getElementById("localVideo");
  localVideo.srcObject = new MediaStream([videoTrack.mediaStreamTrack]);
  localVideo.muted = true;
  await localVideo.play();

  // 🎧 TRACKS DISTANTES
  room.on("trackSubscribed", (track) => {
    if (track.kind === "video") {
      const remoteVideo = document.getElementById("remoteVideo");
      remoteVideo.srcObject = new MediaStream([track.mediaStreamTrack]);
      remoteVideo.play();
    }

    if (track.kind === "audio") {
      const audioEl = document.createElement("audio");
      audioEl.srcObject = new MediaStream([track.mediaStreamTrack]);
      audioEl.autoplay = true;
      audioEl.play();
      document.body.appendChild(audioEl);
    }
  });
};

window.toggleMic = () => {
  if (audioTrack) audioTrack.enabled = !audioTrack.enabled;
};

window.toggleCam = () => {
  if (videoTrack) videoTrack.enabled = !videoTrack.enabled;
};

window.hangup = async () => {
  await fetch("{% url 'techfeed:end_call' call.room_name %}", {
    method: "POST",
    headers: { "X-CSRFToken": "{{ csrf_token }}" }
  });
  location.href = "{% url 'techfeed:feed' %}";
};
</script>

<style>
body { background:#000; color:#fff; font-family:system-ui; }
.wrap { max-width:900px; margin:20px auto; padding:10px }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px }
.card { background:#111; border-radius:14px; overflow:hidden; min-height:260px }
video { width:100%; height:100%; object-fit:cover }
.controls { display:flex; gap:10px; margin-top:12px }
.btn { padding:10px 16px; border-radius:999px; border:none; font-weight:800; cursor:pointer }
.btn-green { background:#00ff99; color:#000 }
.btn-blue { background:#00d2ff; color:#000 }
.btn-red { background:#ff0050; color:#fff }
</style>

<div class="wrap">
  <h3>🔒 Appel privé — {{ call.room_name }}</h3>

  <!-- ⚠️ OBLIGATOIRE -->
  <button class="btn btn-green" onclick="startCall()">▶️ Démarrer l’appel</button>

  <div class="grid" style="margin-top:12px;">
    <div class="card">
      <video id="localVideo" autoplay playsinline></video>
    </div>
    <div class="card">
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-blue" onclick="toggleMic()">🎙️ Mic</button>
    <button class="btn btn-blue" onclick="toggleCam()">📷 Cam</button>
    <button class="btn btn-red" onclick="hangup()">❌ Raccrocher</button>
  </div>
</div>

{% endblock %}

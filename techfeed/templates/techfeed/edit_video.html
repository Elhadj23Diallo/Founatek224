{% extends "techfeed/base.html" %}
{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
  body {
    background-color: #000;
    color: #fff;
    font-family: 'Roboto', sans-serif;
    margin: 0; padding: 0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }

  .edit-container {
    width: 100%; max-width: 500px;
    background: #111;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 0 40px rgba(0, 210, 255, 0.1);
    position: relative;
  }

  /* Header */
  .edit-header {
    text-align: center; margin-bottom: 30px;
  }
  .edit-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.5rem; color: #fff; margin: 0;
  }
  .edit-subtitle {
    color: #666; font-size: 0.9rem; margin-top: 5px;
  }

  /* Preview Vidéo */
  .video-preview-box {
    width: 100%; height: 250px;
    background: #000; border-radius: 12px;
    overflow: hidden; margin-bottom: 25px;
    border: 2px solid #222;
    display: flex; justify-content: center; align-items: center;
  }
  .video-preview-box video {
    width: 100%; height: 100%; object-fit: contain;
  }

  /* Formulaire */
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block; color: #00d2ff; margin-bottom: 8px;
    font-family: 'Orbitron', sans-serif; font-size: 0.9rem;
  }

  input[type="text"], textarea, select {
    width: 100%; padding: 12px;
    background: #1a1a1a; border: 1px solid #333;
    color: #fff; border-radius: 8px;
    font-family: 'Roboto', sans-serif; font-size: 1rem;
    box-sizing: border-box; transition: 0.3s;
  }
  input:focus, textarea:focus {
    border-color: #00d2ff; outline: none;
    box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
  }

  /* Boutons */
  .btn-save {
    width: 100%; padding: 15px;
    background: linear-gradient(90deg, #00d2ff, #0077ff);
    border: none; border-radius: 30px;
    color: #000; font-weight: 700; font-family: 'Orbitron';
    cursor: pointer; text-transform: uppercase;
    margin-top: 10px; transition: 0.2s;
  }
  .btn-save:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); }

  .btn-cancel {
    display: block; text-align: center;
    margin-top: 20px; color: #666; text-decoration: none;
    font-size: 0.9rem; transition: 0.2s;
  }
  .btn-cancel:hover { color: #fff; }

  .btn-delete-video {
      background: transparent; border: 1px solid #ef233c;
      color: #ef233c; width: 100%; padding: 12px;
      border-radius: 30px; margin-top: 15px; cursor: pointer;
      font-weight: bold; transition: 0.2s;
  }
  .btn-delete-video:hover { background: #ef233c; color: white; }
</style>

<div class="edit-container">
  
  <div class="edit-header">
    <h2 class="edit-title">Modifier la Vidéo</h2>
    <p class="edit-subtitle">Mets à jour les infos de ta publication</p>
  </div>

  <form method="post" action="">
    {% csrf_token %}

    <div class="video-preview-box">
        <video src="{{ video.video.url }}" controls controlsList="nodownload"></video>
    </div>

    <div class="form-group">
        <label>DESCRIPTION</label>
        <textarea name="description" rows="4" placeholder="Décris ta vidéo...">{{ video.description }}</textarea>
    </div>

    <div class="form-group">
        <label>TAGS</label>
        <input type="text" name="tags" value="{{ video.tags }}" placeholder="#Tech, #AI...">
    </div>

    <button type="submit" class="btn-save">Enregistrer les modifications</button>
  </form>

  <a href="{% url 'techfeed:delete_video' video.id %}" class="btn-delete-video" onclick="return confirm('Es-tu sûr de vouloir supprimer cette vidéo DÉFINITIVEMENT ?');" style="text-decoration:none; display:block; text-align:center;">
      <i class="fas fa-trash-alt"></i> Supprimer la vidéo
  </a>

  <a href="{% url 'techfeed:profile' user.username %}" class="btn-cancel">Annuler et Retourner au profil</a>

</div>

{% endblock %}

{% extends "techfeed/base.html" %}
{% block content %}

<script type="module">
import {
  Room,
  createLocalAudioTrack
} from "https://unpkg.com/livekit-client/dist/livekit-client.esm.mjs";

const LIVEKIT_URL = "{{ LIVEKIT_URL }}";
const TOKEN_URL = "{% url 'techfeed:group_call_livekit_token' call.room_name %}";

let room = null;
let audioTrack = null;
let started = false;

window.startCall = async function () {
  if (started) return;
  started = true;

  // 🔑 Récupération du token
  const res = await fetch(TOKEN_URL);
  const data = await res.json();

  if (!data.token) {
    alert("Token LiveKit invalide");
    started = false;
    return;
  }

  // 🔗 Connexion à la room
  room = new Room();
  await room.connect(LIVEKIT_URL, data.token);

  // 🎤 Track audio LOCAL (micro)
  audioTrack = await createLocalAudioTrack({
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl: true,
  });

  await room.localParticipant.publishTrack(audioTrack);

  // 🔊 TRACKS AUDIO DISTANTS UNIQUEMENT
  room.on("trackSubscribed", (track, publication, participant) => {

    // ❌ Ne jamais jouer son propre audio
    if (participant.identity === room.localParticipant.identity) {
      return;
    }

    if (track.kind === "audio") {
      const audioEl = document.createElement("audio");
      audioEl.srcObject = new MediaStream([track.mediaStreamTrack]);
      audioEl.autoplay = true;
      audioEl.playsInline = true;

      document.body.appendChild(audioEl);

      audioEl.play().catch(() => {
        console.warn("Lecture audio bloquée par le navigateur");
      });
    }
  });
};

window.toggleMic = () => {
  if (!audioTrack) return;
  audioTrack.enabled = !audioTrack.enabled;
};

window.hangup = async () => {
  try {
    await fetch("{% url 'techfeed:end_group_call' call.room_name %}", {
      method: "POST",
      headers: { "X-CSRFToken": "{{ csrf_token }}" }
    });
  } catch (e) {}

  location.href = "{% url 'techfeed:group_chat' call.group.id %}";
};
</script>

<style>
body {
  background:#000;
  color:#fff;
  font-family:system-ui;
}
.wrap {
  max-width:650px;
  margin:20px auto;
  padding:14px;
}
.btn {
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:800;
  cursor:pointer;
}
.btn-green { background:#00ff99; color:#000 }
.btn-blue  { background:#00d2ff; color:#000 }
.btn-red   { background:#ff0050; color:#fff }

.row {
  display:flex;
  gap:10px;
  margin-top:14px;
  flex-wrap:wrap;
}
.card {
  background:#111;
  border:1px solid #222;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
  color:#aaa;
  font-size:0.9rem;
}
</style>

<div class="wrap">
  <h3>📞 Appel audio de groupe — {{ call.group.name }}</h3>

  <div class="row">
    <button class="btn btn-green" onclick="startCall()">▶️ Rejoindre</button>
    <button class="btn btn-blue" onclick="toggleMic()">🎙️ Micro</button>
    <button class="btn btn-red" onclick="hangup()">❌ Quitter</button>
  </div>

  <div class="card">
    💡 Astuce : sur PC, clique sur <strong>▶️ Rejoindre</strong> pour autoriser le micro.<br>
    🎧 Casque recommandé pour une meilleure qualité audio.
  </div>
</div>

{% endblock %}

{% extends "techfeed/base.html" %}
{% block content %}

<script type="module">
import {
  Room,
  createLocalAudioTrack,
  createLocalVideoTrack
} from "https://unpkg.com/livekit-client/dist/livekit-client.esm.mjs";

const LIVEKIT_URL = "{{ LIVEKIT_URL }}";
const TOKEN_URL = "{% url 'techfeed:group_call_livekit_token' call.room_name %}";

let room;
let started = false;

window.startCall = async function () {
  if (started) return;
  started = true;

  const res = await fetch(TOKEN_URL);
  const { token } = await res.json();

  room = new Room();
  await room.connect(LIVEKIT_URL, token);

  const audioTrack = await createLocalAudioTrack();
  const videoTrack = await createLocalVideoTrack();

  await room.localParticipant.publishTrack(audioTrack);
  await room.localParticipant.publishTrack(videoTrack);

  const localVideo = document.getElementById("localVideo");
  localVideo.srcObject = new MediaStream([videoTrack.mediaStreamTrack]);
  localVideo.muted = true;
  await localVideo.play();

  room.on("trackSubscribed", (track) => {
    if (track.kind === "video") {
      const video = document.createElement("video");
      video.autoplay = true;
      video.srcObject = new MediaStream([track.mediaStreamTrack]);
      document.getElementById("videos").appendChild(video);
    }
    if (track.kind === "audio") {
      const audio = document.createElement("audio");
      audio.autoplay = true;
      audio.srcObject = new MediaStream([track.mediaStreamTrack]);
      document.body.appendChild(audio);
    }
  });
};

window.hangup = async () => {
  await fetch("{% url 'techfeed:end_group_call' call.room_name %}", {
    method: "POST",
    headers: { "X-CSRFToken": "{{ csrf_token }}" }
  });
  location.href = "{% url 'techfeed:group_chat' call.group.id %}";
};
</script>

<style>
video { width:100%; max-height:260px; background:#111; border-radius:14px }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px }
.btn { padding:12px 18px; border-radius:999px; font-weight:800; border:none }
.btn-green { background:#00ff99 }
.btn-red { background:#ff0050; color:#fff }
</style>

<div class="wrap">
  <h2>📹 Appel vidéo de groupe</h2>
  <button class="btn btn-green" onclick="startCall()">▶️ Démarrer</button>
  <video id="localVideo" autoplay playsinline></video>
  <div id="videos" class="grid"></div>
  <button class="btn btn-red" onclick="hangup()">❌ Quitter</button>
</div>

{% endblock %}

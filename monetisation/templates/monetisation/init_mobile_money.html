{% extends 'espcontrol/base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* --- THÈME FUTURISTE --- */
    body {
        background:
            radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 1) 0%, rgba(15, 23, 42, 1) 50%, rgba(2, 6, 23, 1) 100%),
            linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 60px 60px, 60px 60px;
        background-attachment: fixed;
        color: #f1f5f9;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        margin: 0;
    }

    .container-custom {
        max-width: 700px;
        margin: 50px auto;
        padding: 35px;
        background-color: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        border: 1px solid rgba(51, 65, 85, 0.5);
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    /* --- Header --- */
    .header-section {
        text-align: center;
        margin-bottom: 30px;
        border-bottom: 1px solid #334155;
        padding-bottom: 20px;
    }
    .header-section h2 {
        color: #22d3ee;
        font-size: 2rem;
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
        margin-bottom: 10px;
    }

    /* --- Formulaire --- */
    .form-group { margin-bottom: 25px; }
    .form-label {
        display: block;
        margin-bottom: 8px;
        color: #94a3b8;
        font-weight: 600;
    }
    .form-label i { width: 20px; color: #22d3ee; }

    /* Inputs Sombres */
    .form-control-dark {
        width: 100%;
        background-color: #0f172a;
        border: 1px solid #334155;
        color: #f1f5f9;
        padding: 12px 15px;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    .form-control-dark:focus {
        outline: none;
        border-color: #22d3ee;
        box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
    }

    /* Select Customisé avec flèche SVG */
    select.form-control-dark {
        appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2322d3ee%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 15px top 50%;
        background-size: 12px auto;
    }

    /* Bouton Payer */
    .btn-submit {
        width: 100%;
        padding: 14px;
        background-color: #22c55e; /* Vert pour paiement */
        color: #0f172a;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .btn-submit:hover {
        background-color: #4ade80;
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        transform: translateY(-2px);
    }

    /* Alertes */
    .alert-box {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        background: rgba(239, 68, 68, 0.1); 
        border: 1px solid #ef4444; 
        color: #fca5a5;
        display: flex; align-items: center; gap: 10px;
    }

    /* Zone PayPal */
    #paypal-button-container {
        background: rgba(255, 255, 255, 0.05);
        padding: 20px;
        border-radius: 12px;
        border: 1px dashed #334155;
    }
</style>

<div class="container-custom">
    
    <div class="header-section">
        <h2><i class="fas fa-credit-card"></i> Recharger le compte</h2>
        <p style="color: #94a3b8;">Ajoutez des fonds via Mobile Money ou PayPal.</p>
    </div>

    {% if error %}
        <div class="alert-box">
            <i class="fas fa-exclamation-triangle"></i> {{ error }}
        </div>
    {% endif %}

    <form method="POST" id="payment-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label"><i class="fas fa-coins"></i> Montant ({{ currency }})</label>
            <input type="number" id="amount" name="amount" step="0.01" class="form-control-dark" placeholder="Ex: 50.00" required>
        </div>

        <div class="form-group">
            <label class="form-label"><i class="fas fa-hand-holding-usd"></i> Moyen de paiement</label>
            <select name="provider" id="provider-select" class="form-control-dark">
                <option value="paypal">PayPal / Carte Bancaire</option>
                <option value="MTN">MTN Mobile Money</option>
                <option value="Orange">Orange Money</option>
                <option value="Moov">Moov Money</option>
                <option value="Wave">Wave</option>
            </select>
        </div>

        <div class="form-group" id="phone-group">
            <label class="form-label"><i class="fas fa-mobile-alt"></i> Numéro de téléphone</label>
            <input type="text" name="phone_number" class="form-control-dark" placeholder="Ex: 62X XX XX XX">
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
            <i class="fas fa-check-circle"></i> Valider le paiement
        </button>
    </form>

    <div id="paypal-button-container" class="mt-3" style="display:none;">
        <p style="text-align: center; color: #94a3b8; margin-bottom: 15px; font-size: 0.9rem;">
            <i class="fas fa-lock"></i> Transaction sécurisée par PayPal
        </p>
    </div>

    <div style="text-align: center; margin-top: 25px;">
        <a href="{% url 'monetisation:wallet_dashboard' %}" style="color: #64748b; text-decoration: none;">
            <i class="fas fa-arrow-left"></i> Annuler
        </a>
    </div>

</div>

<script src="https://www.paypal.com/sdk/js?client-id={{ PAYPAL_CLIENT_ID }}&currency=EUR"></script>

<script>
const providerSelect = document.getElementById("provider-select");
const phoneGroup = document.getElementById("phone-group");
const paypalContainer = document.getElementById("paypal-button-container");
const submitBtn = document.getElementById("submit-btn");
const amountInput = document.getElementById("amount");

function togglePaymentFields() {
    if (providerSelect.value === "paypal") {
        phoneGroup.style.display = "none";
        // Pour PayPal, on affiche le conteneur mais on cache le bouton submit classique
        paypalContainer.style.display = "block";
        submitBtn.style.display = "none";
    } else {
        phoneGroup.style.display = "block";
        // Pour Mobile Money, on cache PayPal et on affiche le bouton submit classique
        paypalContainer.style.display = "none";
        submitBtn.style.display = "block";
    }
}

// Initialisation au chargement
togglePaymentFields();

// Écouteur sur le changement de fournisseur
providerSelect.addEventListener("change", togglePaymentFields);

// Configuration des boutons PayPal
paypal.Buttons({
    style: {
        layout: 'vertical',
        color:  'blue',
        shape:  'rect',
        label:  'paypal'
    },
    // On vérifie avant de lancer la fenêtre PayPal
    onClick: function(data, actions) {
        const amount = amountInput.value;
        if (!amount || amount <= 0) {
            alert("⚠️ Veuillez entrer un montant valide.");
            amountInput.focus();
            amountInput.style.borderColor = "#ef4444";
            return actions.reject();
        } else {
            amountInput.style.borderColor = "#334155"; // Reset style
            return actions.resolve();
        }
    },
    createOrder: function(data, actions) {
        const amount = amountInput.value;
        
        return fetch("{% url 'monetisation:create_paypal_order' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            // On envoie bien currency: USD au backend pour être cohérent
            body: JSON.stringify({amount: parseFloat(amount), currency: "EUR", type:"credit"})
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                console.error("Erreur serveur:", data.error);
                throw new Error(data.error);
            }
            return data.id;
        });
    },
    onApprove: function(data) {
        return fetch("{% url 'monetisation:capture_paypal_order' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({orderID: data.orderID})
        })
        .then(res => res.json())
        .then(result => {
            if(result.success) {
                // Feedback visuel dans le container PayPal
                paypalContainer.innerHTML = `
                    <div style="text-align: center; color: #4ade80; padding: 20px;">
                        <i class="fas fa-check-circle" style="font-size: 3rem; margin-bottom: 10px;"></i>
                        <h3>Paiement Validé !</h3>
                    </div>
                `;
                setTimeout(() => {
                    window.location.href = "{% url 'monetisation:wallet_dashboard' %}";
                }, 2000);
            } else {
                alert("❌ Erreur lors de la validation du paiement.");
            }
        });
    },
    onError: function(err) {
        console.error('PayPal Error:', err);
        alert("Une erreur est survenue avec PayPal.");
    }
}).render("#paypal-button-container");

</script>

{% endblock %}

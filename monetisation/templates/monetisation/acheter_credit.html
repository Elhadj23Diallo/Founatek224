{% extends "espcontrol/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* --- THÈME FUTURISTE (COHÉRENCE) --- */
    body {
        background:
            radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 1) 0%, rgba(15, 23, 42, 1) 50%, rgba(2, 6, 23, 1) 100%),
            linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 60px 60px, 60px 60px;
        background-attachment: fixed;
        color: #f1f5f9;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        margin: 0;
    }

    .container-custom {
        max-width: 600px; /* Plus étroit pour focaliser l'attention sur le paiement */
        margin: 50px auto;
        padding: 30px;
        background-color: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        border: 1px solid rgba(51, 65, 85, 0.5);
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    /* --- Header --- */
    .header-section {
        text-align: center;
        margin-bottom: 30px;
    }
    .header-section h2 {
        color: #22d3ee;
        font-size: 2rem;
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
        margin-bottom: 5px;
    }
    .header-section p { color: #94a3b8; }

    /* --- Input Montant --- */
    .amount-wrapper {
        position: relative;
        margin-bottom: 20px;
    }
    .currency-symbol {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.5rem;
        color: #22d3ee;
        font-weight: bold;
    }
    .amount-input {
        width: 100%;
        background-color: #0f172a;
        border: 2px solid #334155;
        color: #fff;
        padding: 15px 15px 15px 50px; /* Padding gauche pour le symbole $ */
        border-radius: 12px;
        font-size: 2rem;
        font-weight: bold;
        text-align: center;
        transition: all 0.3s ease;
        font-family: 'Courier New', monospace;
    }
    .amount-input:focus {
        outline: none;
        border-color: #22d3ee;
        box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
    }
    .amount-input::placeholder { color: #334155; opacity: 0.5; }

    /* --- Boutons Rapides --- */
    .quick-amounts {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 30px;
    }
    .quick-btn {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid #334155;
        color: #94a3b8;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.2s;
    }
    .quick-btn:hover {
        background: #22d3ee;
        color: #0f172a;
        border-color: #22d3ee;
        transform: translateY(-2px);
    }

    /* --- Section PayPal --- */
    .paypal-divider {
        display: flex;
        align-items: center;
        margin: 30px 0;
        color: #64748b;
    }
    .paypal-divider::before, .paypal-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #334155;
    }
    .paypal-divider span { padding: 0 15px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }

    .paypal-container {
        background: rgba(255, 255, 255, 0.05);
        padding: 20px;
        border-radius: 12px;
        border: 1px dashed #334155;
    }

    /* Chrome, Safari, Edge, Opera - Enlever les flèches du input number */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    /* Firefox */
    input[type=number] { -moz-appearance: textfield; }

</style>

<div class="container-custom">

    <div class="header-section">
        <h2><i class="fas fa-coins"></i> Acheter du Crédit</h2>
        <p>Rechargez votre compte instantanément.</p>
    </div>

    <label style="color: #cbd5e1; margin-bottom: 10px; display: block; font-weight: 600;">Entrez le montant (€)</label>

    <div class="amount-wrapper">
        <span class="currency-symbol">€</span>
        <input type="number" id="amountInput" class="amount-input" placeholder="0.00" min="1" step="0.01">
    </div>

    <div class="quick-amounts">
        <button type="button" class="quick-btn" onclick="setAmount(5)">+5€</button>
        <button type="button" class="quick-btn" onclick="setAmount(10)">+10€</button>
        <button type="button" class="quick-btn" onclick="setAmount(20)">+20€</button>
        <button type="button" class="quick-btn" onclick="setAmount(50)">+50€</button>
        <button type="button" class="quick-btn" onclick="setAmount(100)">+100€</button>
    </div>

    <div class="paypal-divider">
        <span>Paiement Sécurisé</span>
    </div>

    <div class="paypal-container">
        <div id="paypal-button-container"></div>
        <p style="text-align: center; margin-top: 10px; font-size: 0.8rem; color: #64748b;">
            <i class="fas fa-lock"></i> Transaction cryptée via PayPal
        </p>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'monetisation:wallet_dashboard' %}" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">
            <i class="fas fa-times"></i> Annuler et retourner au portefeuille
        </a>
    </div>

</div>

<script src="https://www.paypal.com/sdk/js?client-id={{ PAYPAL_CLIENT_ID }}&currency=EUR"></script>

<script>
const amountInput = document.getElementById("amountInput");
const container = document.getElementById("paypal-button-container");

// Fonction pour les boutons rapides
function setAmount(val) {
    amountInput.value = val;
    // Petit effet visuel pour montrer que ça a changé
    amountInput.style.borderColor = "#22d3ee";
    setTimeout(() => {
        amountInput.style.borderColor = "#334155";
    }, 300);
}

paypal.Buttons({
    style: {
        layout: 'vertical',
        color:  'blue',
        shape:  'rect',
        label:  'paypal'
    },
    createOrder: function(data, actions) {
        const amount = parseFloat(amountInput.value);

        // Validation visuelle
        if (!amount || amount <= 0) {
            alert("⚠️ Veuillez entrer un montant valide supérieur à 0.");
            amountInput.focus();
            amountInput.style.borderColor = "#ef4444"; // Rouge erreur
            return;
        }

        // Crée l'ordre côté serveur
        return fetch("{% url 'monetisation:create_paypal_order' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({ amount: amount, type: "credit" })
        })
        .then(res => res.json())
        .then(data => {
            if(data.error) {
                alert("Erreur lors de la création de la commande: " + data.error);
                return; // Stop si erreur serveur
            }
            return data.id;
        });
    },
    onApprove: function(data, actions) {
        // Afficher un loader ou désactiver la page ici serait bien
        return fetch("{% url 'monetisation:capture_paypal_order' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({ orderID: data.orderID })
        })
        .then(res => res.json())
        .then(result => {
            if (result.success) {
                // Succès stylisé
                const wrapper = document.querySelector('.paypal-container');
                wrapper.innerHTML = `
                    <div style="text-align: center; color: #4ade80; padding: 20px;">
                        <i class="fas fa-check-circle" style="font-size: 3rem; margin-bottom: 15px;"></i>
                        <h3>Paiement Réussi !</h3>
                        <p>Votre solde a été mis à jour.</p>
                    </div>
                `;
                setTimeout(() => {
                    window.location.href = "{% url 'monetisation:wallet_dashboard' %}";
                }, 2000);
            } else {
                alert("❌ Erreur dans le paiement. Veuillez contacter le support.");
            }
        });
    },
    onError: function (err) {
        console.error('PayPal Error:', err);
        alert("Une erreur est survenue avec PayPal.");
    }
}).render('#paypal-button-container');
</script>
{% endblock %}
